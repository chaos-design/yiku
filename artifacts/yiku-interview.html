<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Yiku Agent Runtime 面试题库与模拟面试控制台" />
    <title>Yiku / Agent Runtime Interview Console</title>
    <style>
      :root {
        --bg: #0c0d0e;
        --surface: #141618;
        --surface-2: #1b1e21;
        --surface-3: #24282c;
        --ink: #f3f0e9;
        --muted: #9da3a7;
        --faint: #696f73;
        --line: #34393d;
        --red: #ff4f40;
        --cyan: #53d6e7;
        --green: #72d29b;
        --yellow: #f2c14e;
        --blue: #6f9dff;
        --purple: #b893ff;
        --radius: 6px;
        --shadow: 0 18px 55px rgba(0, 0, 0, 0.35);
        --display: "Avenir Next Condensed", "DIN Condensed", "Avenir Next", sans-serif;
        --body: "Avenir Next", "Helvetica Neue", "PingFang SC", sans-serif;
        --mono: "SFMono-Regular", Menlo, Monaco, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--body);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      body::after {
        position: fixed;
        z-index: 100;
        inset: 0;
        pointer-events: none;
        content: "";
        opacity: 0.10;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.28'/%3E%3C/svg%3E");
      }
      a { color: var(--cyan); }
      button { font: inherit; cursor: pointer; }

      /* Top bar */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        gap: 16px;
        height: 56px;
        padding: 0 20px;
        background: rgba(12, 13, 14, 0.94);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(6px);
      }
      .brand-mark {
        color: var(--red);
        font-family: var(--display);
        font-size: 1.35rem;
        font-weight: 800;
      }
      .brand-title {
        color: var(--muted);
        font-family: var(--mono);
        font-size: 0.66rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .brand-divider { width: 1px; height: 22px; background: var(--line); }
      .spacer { flex: 1; }
      .mode-switch { display: flex; gap: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 3px; }
      .mode-switch button {
        border: 0; background: transparent; color: var(--muted);
        padding: 6px 14px; border-radius: 4px; font-size: 0.82rem; letter-spacing: 0.02em;
      }
      .mode-switch button.active { background: var(--surface-3); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
      .stat-pill { font-family: var(--mono); font-size: 0.7rem; color: var(--faint); }
      .stat-pill b { color: var(--cyan); font-weight: 600; }

      .layout { display: flex; max-width: 1500px; margin: 0 auto; }

      /* Sidebar */
      .sidebar {
        position: sticky;
        top: 56px;
        align-self: flex-start;
        display: flex;
        flex-direction: column;
        width: 320px;
        height: calc(100vh - 56px);
        overflow: hidden;
        padding: 18px 14px 0;
        border-right: 1px solid var(--line);
        background: var(--surface);
      }
      /* 吸顶固定的筛选区：搜索框 + 分类/难度筛选，不随列表滚动 */
      .sidebar-fixed {
        flex-shrink: 0;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--line);
      }
      .filter-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
      .filter-row:last-child { margin-bottom: 0; }
      .filter-label {
        font-family: var(--mono); font-size: 0.6rem; letter-spacing: 0.1em;
        text-transform: uppercase; color: var(--faint); margin: 0 0 6px 2px;
      }
      .chip {
        border: 1px solid var(--line); background: var(--surface-2); color: var(--muted);
        border-radius: 999px; padding: 4px 11px; font-size: 0.72rem; letter-spacing: 0.02em;
      }
      .chip.active { border-color: var(--cyan); color: var(--cyan); background: rgba(83,214,231,0.08); }
      .search-box {
        width: 100%; margin-bottom: 12px; padding: 9px 12px;
        background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius);
        color: var(--ink); font-size: 0.85rem;
      }
      .search-box::placeholder { color: var(--faint); }
      .q-list {
        list-style: none; margin: 0; padding: 12px 0 18px;
        flex: 1; min-height: 0; overflow-y: auto;
      }
      .q-list li {
        padding: 10px 12px; margin-bottom: 6px; border-radius: var(--radius);
        border: 1px solid transparent; background: var(--surface-2); cursor: pointer;
        transition: border-color 0.12s, background 0.12s;
      }
      .q-list li:hover { border-color: var(--line); }
      .q-list li.active { border-color: var(--red); background: var(--surface-3); }
      .q-list li.done { opacity: 0.72; }
      .q-list .q-idx { font-family: var(--mono); font-size: 0.66rem; color: var(--faint); }
      .q-list .q-title { display: block; font-size: 0.86rem; color: var(--ink); margin-top: 3px; }
      .q-list .q-meta { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
      .tag { font-family: var(--mono); font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.08em; padding: 2px 6px; border-radius: 3px; }
      .tag.cat { color: var(--cyan); background: rgba(83,214,231,0.10); }
      .tag.d1 { color: var(--green); background: rgba(114,210,155,0.12); }
      .tag.d2 { color: var(--yellow); background: rgba(242,193,78,0.12); }
      .tag.d3 { color: var(--red); background: rgba(255,79,64,0.12); }
      .done-dot { margin-left: auto; color: var(--green); font-size: 0.8rem; }

      /* Main */
      .main { flex: 1; min-width: 0; padding: 26px 34px 90px; }

      /* Study card */
      .q-head { border-bottom: 1px solid var(--line); padding-bottom: 16px; margin-bottom: 20px; }
      .q-head .kicker { font-family: var(--mono); font-size: 0.68rem; color: var(--faint); letter-spacing: 0.12em; text-transform: uppercase; }
      .q-head h1 { font-size: 1.5rem; line-height: 1.35; margin: 8px 0 12px; font-weight: 700; }
      .q-head .meta { display: flex; gap: 8px; flex-wrap: wrap; }

      .section { margin-bottom: 18px; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
      .section > .sec-head {
        display: flex; align-items: center; gap: 10px; width: 100%;
        padding: 12px 16px; background: var(--surface-2); border: 0; color: var(--ink);
        text-align: left; border-bottom: 1px solid transparent;
      }
      .section.open > .sec-head { border-bottom-color: var(--line); }
      .sec-head .sec-mark { font-family: var(--mono); font-size: 0.7rem; padding: 2px 7px; border-radius: 3px; letter-spacing: 0.06em; }
      .sec-head .sec-name { font-size: 0.98rem; font-weight: 600; }
      .sec-head .caret { margin-left: auto; color: var(--faint); transition: transform 0.15s; }
      .section.open .caret { transform: rotate(90deg); }
      .sec-body { display: none; padding: 16px 18px; font-size: 0.92rem; color: #e7e3da; }
      .section.open .sec-body { display: block; }
      .mark-idea { color: var(--blue); background: rgba(111,157,255,0.12); }
      .mark-exp { color: var(--purple); background: rgba(184,147,255,0.12); }
      .mark-ans { color: var(--green); background: rgba(114,210,155,0.12); }
      .mark-follow { color: var(--yellow); background: rgba(242,193,78,0.12); }

      .sec-body p { margin: 0 0 12px; }
      .sec-body ul, .sec-body ol { margin: 0 0 12px; padding-left: 22px; }
      .sec-body li { margin-bottom: 5px; }
      .sec-body h4 { margin: 16px 0 8px; font-size: 0.9rem; color: var(--cyan); letter-spacing: 0.02em; }
      .sec-body code:not(pre code) { font-family: var(--mono); font-size: 0.82em; background: var(--surface-3); padding: 1px 6px; border-radius: 3px; color: var(--yellow); }
      .sec-body pre {
        background: #0a0b0c; border: 1px solid var(--line); border-radius: var(--radius);
        padding: 14px 16px; overflow-x: auto; margin: 0 0 12px;
      }
      .sec-body pre code { font-family: var(--mono); font-size: 0.8rem; color: #d8e0dc; line-height: 1.55; }
      .kw { color: var(--red); }
      .cm { color: var(--faint); font-style: italic; }
      .st { color: var(--green); }
      .hl { color: var(--cyan); font-weight: 600; }

      .nav-row { display: flex; justify-content: space-between; margin-top: 26px; }
      .nav-btn { border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); padding: 9px 18px; border-radius: var(--radius); font-size: 0.85rem; }
      .nav-btn:hover { border-color: var(--cyan); }
      .nav-btn.primary { border-color: var(--red); color: var(--red); }
      .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }

      .tool-row { display: flex; gap: 8px; margin-top: 4px; }
      .ghost-btn { border: 1px solid var(--line); background: transparent; color: var(--muted); padding: 6px 12px; border-radius: var(--radius); font-size: 0.78rem; }
      .ghost-btn:hover { color: var(--ink); border-color: var(--cyan); }

      /* Mock mode */
      .mock-wrap { max-width: 900px; margin: 0 auto; }
      .mock-setup { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px 28px; }
      .mock-setup h2 { margin: 0 0 6px; font-size: 1.3rem; }
      .mock-setup p.sub { color: var(--muted); margin: 0 0 22px; font-size: 0.9rem; }
      .field { margin-bottom: 18px; }
      .field label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 8px; letter-spacing: 0.04em; text-transform: uppercase; font-family: var(--mono); }
      .opt-row { display: flex; flex-wrap: wrap; gap: 8px; }
      .opt-row .chip { cursor: pointer; padding: 7px 15px; font-size: 0.82rem; }
      .range-row { display: flex; align-items: center; gap: 14px; }
      .range-row input[type=range] { flex: 1; accent-color: var(--red); }
      .range-row .val { font-family: var(--mono); color: var(--cyan); min-width: 30px; text-align: right; }
      .start-btn { width: 100%; margin-top: 8px; padding: 13px; border: 1px solid var(--red); background: rgba(255,79,64,0.10); color: var(--red); border-radius: var(--radius); font-size: 0.95rem; letter-spacing: 0.04em; font-weight: 600; }
      .start-btn:hover { background: rgba(255,79,64,0.18); }

      .mock-progress { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
      .mock-progress .bar { flex: 1; height: 6px; background: var(--surface-3); border-radius: 3px; overflow: hidden; }
      .mock-progress .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--red), var(--yellow)); width: 0; transition: width 0.3s; }
      .mock-progress .count { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); }
      .timer { font-family: var(--mono); font-size: 0.9rem; color: var(--cyan); }
      .timer.warn { color: var(--yellow); }
      .timer.danger { color: var(--red); }

      .mock-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px 26px; }
      .mock-card .kicker { font-family: var(--mono); font-size: 0.66rem; color: var(--faint); letter-spacing: 0.12em; text-transform: uppercase; }
      .mock-card h2 { font-size: 1.25rem; margin: 8px 0 16px; line-height: 1.4; }
      .mock-card textarea {
        width: 100%; min-height: 150px; resize: vertical;
        background: #0a0b0c; border: 1px solid var(--line); border-radius: var(--radius);
        color: var(--ink); font-family: var(--mono); font-size: 0.86rem; padding: 14px; line-height: 1.6;
      }
      .mock-card textarea:focus { outline: none; border-color: var(--cyan); }
      .hint-box { margin-top: 12px; padding: 12px 14px; border-left: 3px solid var(--blue); background: rgba(111,157,255,0.06); font-size: 0.85rem; color: var(--muted); border-radius: 0 4px 4px 0; }
      .self-grade { margin-top: 18px; }
      .self-grade .grade-opts { display: flex; gap: 8px; flex-wrap: wrap; }
      .grade-btn { flex: 1; min-width: 120px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); padding: 12px; border-radius: var(--radius); text-align: center; }
      .grade-btn small { display: block; color: var(--faint); font-size: 0.7rem; margin-top: 3px; }
      .grade-btn.g0:hover { border-color: var(--red); }
      .grade-btn.g1:hover { border-color: var(--yellow); }
      .grade-btn.g2:hover { border-color: var(--green); }

      .reveal-block { margin-top: 18px; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }

      /* Report */
      .report { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 28px; }
      .report h2 { margin: 0 0 20px; }
      .score-hero { display: flex; align-items: center; gap: 28px; margin-bottom: 26px; }
      .score-ring { width: 130px; height: 130px; flex-shrink: 0; }
      .score-legend { flex: 1; }
      .score-legend .grade-big { font-size: 2.4rem; font-family: var(--display); font-weight: 800; }
      .score-legend .pct { font-family: var(--mono); color: var(--muted); }
      .breakdown { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 24px; }
      .breakdown .cell { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
      .breakdown .cell .k { font-size: 0.72rem; color: var(--faint); font-family: var(--mono); text-transform: uppercase; }
      .breakdown .cell .v { font-size: 1.3rem; font-weight: 700; margin-top: 4px; }
      .review-item { border-top: 1px solid var(--line); padding: 14px 0; }
      .review-item .ri-head { display: flex; align-items: center; gap: 10px; }
      .review-item .ri-title { font-size: 0.92rem; }
      .review-item .ri-badge { margin-left: auto; font-family: var(--mono); font-size: 0.68rem; padding: 2px 8px; border-radius: 3px; }

      .empty { color: var(--faint); text-align: center; padding: 60px 20px; }

      @media (max-width: 900px) {
        .sidebar { display: none; }
        .main { padding: 20px 16px 80px; }
        .breakdown { grid-template-columns: 1fr; }
        .score-hero { flex-direction: column; text-align: center; }
      }
      .mobile-only { display: none; }
      @media (max-width: 900px) { .mobile-only { display: inline-flex; } }
    </style>
  </head>
  <body>
    <div class="topbar">
      <span class="brand-mark">YIKU</span>
      <span class="brand-divider"></span>
      <span class="brand-title">Agent Runtime · Interview Console</span>
      <span class="spacer"></span>
      <div class="mode-switch" id="modeSwitch">
        <button type="button" data-mode="study" class="active">题库研习</button>
        <button type="button" data-mode="mock">模拟面试</button>
      </div>
      <span class="stat-pill" id="progressStat">进度 <b>0</b>/0</span>
    </div>

    <div class="layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-fixed">
          <input class="search-box" id="searchBox" placeholder="搜索题目 / 关键词…" />
          <p class="filter-label">分类</p>
          <div class="filter-row" id="catFilter"></div>
          <p class="filter-label">难度</p>
          <div class="filter-row" id="diffFilter"></div>
        </div>
        <ul class="q-list" id="qList"></ul>
      </aside>

      <main class="main" id="main"></main>
    </div>

    <script>
      // ====================================================================
      // 数据层：面试题库（基于 Yiku 仓库 docs/ 与源码结构提炼）
      // 每题字段：id, cat, diff(1/2/3), q(问题), idea(思路), exp(解释),
      //           ans(答案), follow(追问), tags
      // 内容为预格式化 HTML 字符串（自包含，无外部资源）。
      // ====================================================================
      const CATS = [
        "架构与包边界", "Runtime 与编排", "权限与安全", "Atomic Flow / 可观测性",
        "Memory 记忆", "Context Compact", "Subagents / A2A", "Evals 质量门禁",
        "Prompt 信任边界", "Skills / MCP", "Tasks / 会话状态", "工程实践"
      ];
      const DIFF_LABEL = { 1: "基础", 2: "进阶", 3: "深入" };
    </script>
    <script id="data-script">
      const QUESTIONS = [
      {
        id: "q1",
        cat: "架构与包边界",
        diff: 1,
        tags: ["monorepo", "package-boundaries", "依赖方向"],
        q: "请概述 Yiku 的整体分层与包边界。为什么要把「宿主 / 执行编排 / Agent 能力 / 基础协议」拆成独立的包？",
        idea: `
          <p>这是一道<b>系统设计定位题</b>，考察你能否用「依赖方向」这一根主线把十几个包串起来，而不是罗列包名。回答顺序建议：</p>
          <ol>
            <li>先给<span class="hl">分层心智模型</span>（宿主层 → 执行层 → Agent 能力层 → 策略服务层 → 基础协议层）。</li>
            <li>再给<span class="hl">依赖方向的硬约束</span>：高层组合低层，基础协议绝不反向依赖 CLI 或具体 Agent。</li>
            <li>最后用一两个例子说明<span class="hl">这样拆分带来的好处</span>（可替换宿主、可独立测试、可复用协议）。</li>
          </ol>`,
        exp: `
          <p>Yiku 是一个 TypeScript + ESM + pnpm Workspace 的 Monorepo。核心思想是<b>「谁运行 Agent、谁定义能力、谁只是协议」三者分离</b>：</p>
          <h4>五个层次</h4>
          <ul>
            <li><b>宿主层</b>：<code>@yiku/cli</code>（Ink 终端 UI、<code>yiku</code> 二进制）、<code>@yiku/agent-studio</code>（协议无关 Studio Shell）、<code>@yiku/agent-observatory</code>（默认观测插件）。宿主负责交互，把执行<b>委托</b>给 Orchestrator。</li>
            <li><b>执行层</b>：<code>@yiku/agent-orchestrator</code> 是<b>唯一</b>能构建并运行完整 Agent Session 的包。</li>
            <li><b>Agent 能力层</b>：<code>@yiku/agent-code</code>、<code>@yiku/agent-research</code> 定义工具、Prompt、领域逻辑，不拥有 Session 生命周期。</li>
            <li><b>策略服务层</b>：<code>@yiku/config</code>、<code>@yiku/hooks</code>、<code>@yiku/memories</code>、<code>@yiku/evals</code>、<code>@yiku/sandbox</code>。</li>
            <li><b>基础协议层</b>：<code>@yiku/atomic-flow</code>（运行事实）、<code>@yiku/trajectory</code>（投影）、<code>@yiku/flow-graph</code>（几何布线）。</li>
          </ul>
          <h4>关键不变量</h4>
          <p>依赖只能自上而下。<code>@yiku/atomic-flow</code>、<code>@yiku/agent-studio</code>、<code>@yiku/config</code>、<code>@yiku/flow-graph</code>、<code>@yiku/hooks</code>、<code>@yiku/sandbox</code> <b>不依赖任何其它 Workspace 包</b>；<code>memories</code>、<code>evals</code>、<code>trajectory</code> 只依赖 <code>atomic-flow</code>。</p>`,
        ans: `
          <p><b>一句话</b>：Yiku 按「宿主 / 执行编排 / Agent 能力 / 策略服务 / 基础协议」五层拆包，依赖严格自上而下，基础协议零业务依赖。</p>
          <p><b>为什么这样拆</b>：</p>
          <ul>
            <li><b>可替换宿主</b>：CLI 和自定义 Node 宿主共享同一个 Orchestrator。想做 Web 宿主时，只要服务端持有 Runtime，不用重写执行逻辑。</li>
            <li><b>单一职责 + 可独立测试</b>：<code>@yiku/sandbox</code> 只做进程隔离、不解析命令；<code>@yiku/flow-graph</code> 只做正交布线、不知道业务节点。每个包能单独跑测试。</li>
            <li><b>协议复用</b>：<code>atomic-flow</code> 是运行观测的<b>唯一事实源</b>，Trajectory 和 Studio Run 都是它的可重建<b>投影</b>——这让「记录一次、多处消费」成立。</li>
            <li><b>防止腐化</b>：明确「Hooks 的 allow 不能覆盖 Runtime 的 deny」「Studio 不绑定 Yiku 业务协议」这类边界不变量，避免高层耦合渗透到底层。</li>
          </ul>
          <p><b>诚实的补充（会加分）</b>：当前 Orchestrator 其实是「带默认业务实现的组合根」而非纯 Runtime Kernel——它内置注册了 <code>CodeAgentFactory</code>/<code>ResearchAgentFactory</code>，而且通用 Permission/User-Question 契约目前定义在 <code>@yiku/agent-code</code> 里，导致即便只跑 Research 也得装 Code 包。这是文档里明确记录的「边界债务」。</p>`,

        idea: `

        exp: `

      {
        id: "q3",
        cat: "Runtime 与编排",
        diff: 2,
        tags: ["stage", "autoContinue", "预算", "恢复"],
        q: "Yiku 如何支撑「长程任务」？请讲讲 Stage、预算、autoContinue 与跨进程恢复之间的关系。",
        idea: `
          <p>核心是理解 <b>Session 身份稳定、Stage 可切分</b> 这个设计。答题分三块：Stage 何时结束 → autoContinue 何时续跑 → 恢复从哪里开始。强调「稳定边界」这个词。</p>`,
        exp: `
          <p>一个 Session 可以横跨很长时间和多次进程。为避免单次模型调用无限膨胀，Runtime 把执行切成 <b>Stage</b>：</p>
          <h4>Stage 结束/暂停的条件</h4>
          <ul>
            <li>正常完成；</li>
            <li>达到 Turn / Tool / 时长 / 无进展 预算（<code>maxTurnsPerStage</code>、<code>maxToolCallsPerStage</code>、<code>maxStageDurationMs</code>、<code>maxNoProgressStages</code>）；</li>
            <li>等待用户输入或审批；</li>
            <li>用户取消；</li>
            <li>Provider / 工具 / Hook / Validator / Eval 失败。</li>
          </ul>
          <h4>autoContinue</h4>
          <p><code>runtime.autoContinue: true</code>（默认）允许 Runtime 在<b>可继续的</b>停止原因后自动开启下一 Stage，不需要用户反复输入「继续」。</p>
          <h4>恢复</h4>
          <p>跨进程恢复<b>只从已持久化的稳定 Stage 边界</b>开始，<b>不</b>序列化 SDK 内部 RunState。等待中的 User Question 作为 Pending Input 持久化到 Session State v5；恢复时按 Provider 的 Continuation Capability 使用明确标记的 reconstructed continuation，否则保持 <code>needs-review</code>。</p>`,
        ans: `
          <p><b>四者的关系可以串成一句话</b>：预算决定 Stage 何时收尾 → 收尾原因若「可继续」则 autoContinue 开下一个 Stage → 所有状态在稳定 Stage 边界持久化 → 进程重启后从该边界恢复，而非从半截的模型调用恢复。</p>
          <ul>
            <li><b>Session 身份稳定，Stage 可增长</b>：长任务是「一个 Session、多个 Stage」，Atomic Flow 仍是一个 Run。</li>
            <li><b>预算是安全阀</b>：防止某一 Stage 因为模型循环或工具风暴而失控，同时给「无进展」也设了上限（<code>maxNoProgressStages</code>）。</li>
            <li><b>autoContinue 让长任务自驱</b>：符合「多步骤计划自动连续推进」的体验，但只在可继续的停止原因后触发——失败/等待审批不会被自动跳过。</li>
            <li><b>恢复只认稳定边界</b>：这是关键的可靠性决策。外部副作用无法保证 exactly-once，所以恢复时可能进入人工复核（needs-review），而不是盲目重放。</li>
          </ul>
          <p><b>自动 Compact</b> 也只发生在可继续的 Stage 边界，不会打断正在执行的 Stage——这与预算/恢复共享同一「稳定边界」概念。</p>`,

          <ul>

          </ul>`

      {
        id: "q4",
        cat: "权限与安全",
        diff: 3,
        tags: ["permission", "capability-scope", "sandbox", "fail-closed"],
        q: "Yiku 的权限体系不是一个布尔开关。请描述一次高风险 Shell 命令（如 rm -rf ./dist）从发起到执行要穿过哪些层，以及每层的失败语义。",
        idea: `
          <p>这是压轴级安全题。面试官要看你能否说清 <b>多层纵深防御 + deny 优先 + 授权不能扩权</b> 三个原则。建议顺着「决策流程图」自上而下讲，每层都点出「谁拥有它」和「失败时怎样」。</p>`,
        exp: `
          <p>权限 = Capability Scope、Workspace 授权、工具静态策略、Permission Profile、Hook、人工/Managed 审批、OS Sandbox 的<b>交集</b>。授权只能在既有硬边界<b>内</b>放行，不能让配置/Skill/Hook/Agent 自行扩权。</p>
          <h4>七个层次（自上而下）</h4>
          <ol>
            <li><b>Capability Scope</b>（Orchestrator）：工具对当前 Agent 是否可见。不可见 → 根本调不到。</li>
            <li><b>Workspace Authorization</b>（CLI/Host）：只读还是读写。只读下首次写入触发升级请求。</li>
            <li><b>Workspace Boundary</b>（agent-code）：真实路径、符号链接、路径逃逸检查。<b>硬拒绝</b>。</li>
            <li><b>Tool/Shell Policy</b>（agent-code）：把操作分类为 <code>allow / ask / deny</code>。<code>deny</code> 直接不进入审批。</li>
            <li><b>Permission Profile</b>（cli）：按 Policy/Command/MCP/Network 规则细化。<code>deny</code> 优先。</li>
            <li><b>Permission Hook</b>：<code>block/stop</code> 拒绝。</li>
            <li><b>User / Managed Policy</b>：对剩余 <code>ask</code> 给一次/Session/持久决策。无处理器 → 拒绝。</li>
          </ol>
          <p>之后才是 <b>Shell Sandbox</b>（macOS <code>sandbox-exec</code> / Linux rootless <code>bubblewrap</code>）——它是执行边界，不是审批系统。</p>`,
        ans: `
          <p>以 <code>rm -rf ./dist</code> 为例，逐层穿越：</p>
          <ol>
            <li><b>Capability Scope</b>：bashTool 在当前 Agent 的 Scope 内 → 通过。</li>
            <li><b>Workspace 写入</b>：删除属写操作，若 Session 只读则请求升级为 read-write，拒绝即 Denied。</li>
            <li><b>Boundary</b>：<code>./dist</code> 解析真实路径确认在 Workspace 内、无符号链接逃逸 → 通过；若指向外部则<b>硬拒绝</b>。</li>
            <li><b>Shell Policy</b>：结构化 Shell Parser（非字符串前缀）识别 <code>rm -rf</code> 命中 <code>recursive-force-rm</code>，风险 high，分类为 <code>ask</code>。（若是 <code>sudo</code>/<code>mkfs</code>/<code>curl|sh</code> 则直接 <code>deny</code>，不进入审批。）</li>
            <li><b>Permission Profile</b>：匹配 <code>commandRules</code>/<code>policyRules</code>；命中任一 <code>deny</code> 优先，否则用最具体的通配规则。</li>
            <li><b>Permission Hook</b>：发 <code>PermissionRequest</code>；Hook <code>block/stop</code> 立即拒绝并补发 <code>PermissionDenied</code>。</li>
            <li><b>用户审批</b>：宿主渲染审批 UI，用户可给 <code>once / session / persistent</code> 授权。</li>
            <li><b>Sandbox 执行</b>：即便审批通过，仍必须在 Sandbox 允许范围内运行。</li>
          </ol>
          <h4>核心不变量</h4>
          <ul>
            <li>Runtime <code>deny</code> 在 Profile/Hook/人工之前生效，后续层<b>不能覆盖</b>。</li>
            <li>Hook 的 <code>allow</code> 只能处理已进入 Hook 的请求，不能覆盖先前硬拒绝。</li>
            <li>Workspace 写授权 ≠ 允许删除/发布/提权/任意 Shell。</li>
            <li><b>fail-closed</b>：无审批处理器默认 deny；非交互模式缺授权直接失败，不自动选首项。被截断的命令不能生成 Session Grant Key（防止用不完整显示当授权依据）。</li>
          </ul>`,
        follow: `
          <ul>
            <li>非交互模式（<code>external</code> Policy Mode）如何放行高风险操作？（答：Workspace Trust + 显式 Managed Policy；Deny 优先、每个 Capability 精确授权、Resource 不支持通配、成功授权必须写私有 NDJSON Audit，Audit 写失败则不执行高风险操作。）</li>
            <li>Sandbox 平台不可用时怎么办？（答：返回稳定错误，是否降级由调用方决定；Code Terminal 降级会重建 ShellPolicy 并发 <code>runtime_boundary_changed</code>；Verification Command 要求强隔离。）</li>
          </ul>`
      },
      {
        id: "q5",
        cat: "Atomic Flow / 可观测性",
        diff: 2,
        tags: ["atomic-flow", "事实源", "fold", "sink", "投影"],
        q: "为什么说 Atomic Flow 是「运行观测的唯一事实源」，而 Trajectory 和 Studio 状态是「投影」？这个设计带来哪些好处和约束？",
        idea: `
          <p>抓住「<b>事实源 vs 派生视图</b>」这对概念，以及支撑它的两个技术保证：<span class="hl">严格递增的 sequence</span> 和 <span class="hl">确定性 fold</span>。好处答「可重建 + 可 replay」，约束答「payload 必须有界、不能塞敏感数据」。</p>`,
        exp: `
          <p><code>@yiku/atomic-flow</code> 是 Run 级事件协议：统一 Atom 定义、Instance 生命周期、Sequence、Edge、Sink、JSONL 和确定性 Fold，但<b>不执行 Agent、不解释领域结果</b>。</p>
          <h4>关键机制</h4>
          <ul>
            <li><b>Event 生命周期</b>：<code>scheduled → start → delta* → end</code>，或 <code>→ error</code>，或 <code>→ skipped</code>。</li>
            <li><b>Sequence</b>：单个 Run 内<b>严格递增</b>。跨系统关联必须用 ID，不能借用墙上时钟。</li>
            <li><b>Fold</b>：<code>foldAtomicEvents(events)</code> 按 sequence 重建 instances/edges/latestSequence。<b>相同规范事件前缀产生相同 Fold State</b>；拒绝 sequence 倒退、混合 Run、不一致 Instance。</li>
            <li><b>Sink 降级</b>：某个 Sink 失败<b>不停止来源 Run</b>——记录降级 code、<code>snapshot().degraded=true</code>、其它 Sink 继续。</li>
            <li><b>Payload 有界</b>：只写摘要（code/counts/durationMs/summary/title/values），<b>禁止</b>写 API Key、完整 Prompt、无限工具输出。</li>
          </ul>`,
        ans: `
          <p><b>「唯一事实源」的含义</b>：所有运行事实只在 Atomic Flow 里记录一次；Trajectory（层级轨迹）和 Studio Run（观测 UI 状态）都由同一事件流<b>派生/重建</b>，自身不产生新事实。</p>
          <p><b>为什么这样设计（好处）</b>：</p>
          <ul>
            <li><b>可重建</b>：因为 fold 是确定性的，任何时刻拿 JSONL 事件都能重算出完全一致的状态——UI 崩了、进程重启了都不丢真相。</li>
            <li><b>可 replay / 可审计</b>：持久 JSONL 保存完整历史，Reader 校验每行；损坏行返回 <code>ATOMIC_FLOW_JSONL_INVALID</code> 而<b>不静默跳过</b>。</li>
            <li><b>解耦观测与执行</b>：Sink 失败只降级不阻断主流程；Observatory 只消费事件，不能反向控制 Session。</li>
            <li><b>多视图一致</b>：Text/Markdown/Mermaid/Trajectory/Studio 都是同一份事实的不同投影，天然一致。</li>
          </ul>
          <p><b>约束</b>：</p>
          <ul>
            <li>生产者必须在<b>同一 Instance</b> 上发终态，不能为 end 重新生成 ID。</li>
            <li>Payload 必须有界且脱敏——大结果走 Artifact/Patch/Store Reference，不塞进事件。</li>
            <li>Parent 表达层级、Edge 表达流程关系，两者不能互相替代。</li>
          </ul>`,
        follow: `
          <ul>
            <li>Trajectory 和 Atomic Flow 是替代关系吗？（答：不是。Atomic Flow 是事实与 replay，A2A 消息/Trajectory 用于关联与展示，各司其职。）</li>
            <li>Studio Sink 有什么网络约束？（答：<code>AtomicStudioSink</code> 只接受回环地址；Project/Run Metadata 在首次成功投递时建立。）</li>
          </ul>`
      },
      {
        id: "q6",
        cat: "Memory 记忆",
        diff: 2,
        tags: ["memories", "scope", "去重", "召回"],
        q: "Yiku 的长期记忆如何做「隔离」与「去重」？请解释 Scope 匹配规则和幂等写入。",
        idea: `
          <p>两条主线：<span class="hl">Scope 匹配</span>（记录可比请求宽、不能比请求窄）和 <span class="hl">去重键 / 幂等键</span>。答完再点一句「Memory 与 Context Compact 是两件事」。</p>`,
        exp: `
          <p><code>@yiku/memories</code> 提供分域、可解释的长期记忆，独立于 Agent SDK。每个操作都要 <code>MemoryContext</code>：必需 <code>namespace</code> + 可选四级 Scope（userId/agentId/projectId/sessionId）。</p>
          <h4>Scope 匹配规则</h4>
          <p>核心口诀：<b>记录可以比请求更宽，不能比请求更窄</b>。记录某字段为 <code>null</code> → 适用于该 namespace 下任意对应请求；记录有具体值 → 请求必须携带相同值。<code>namespace</code> 始终精确匹配。</p>

            <li><b>幂等键</b>：显式 <code>idempotencyKey</code> 在同 namespace 唯一。相同 Key+相同 Hash 返回原记录；相同 Key+不同内容返回 <code>MEMORY_IDEMPOTENCY_CONFLICT</code>。</li>

        ans: `
          <p><b>隔离</b>靠 namespace 精确匹配 + Scope「宽于请求才可召回」规则，在 Manager 与 Store <b>两层</b>校验，用稳定 Scope Key 和 Namespace Hash 防止跨用户/项目/Agent 串味。</p>
          <p><b>去重</b>分两条：内容维度用 <code>namespace+scopeKey+kind+fingerprint</code> 做确定性去重合并；调用维度用 <code>idempotencyKey</code> 保证重试安全。二者叠加让「同一事实无论写多少次都只有一条、且重试不炸」。</p>
          <p><b>持久 Kind → 运行时分类</b>：五种持久 Kind（decision/episode/fact/preference/procedure）投影为三类运行时分类（scenario/procedure/semantic），只影响召回解释和 Atomic Flow，不改 SQLite Schema 或查询 Scope。</p>

      {

        cat: "Context Compact",
        diff: 2,
        tags: ["compaction", "token-budget", "原子性", "信任边界"],
        q: "Context Compact 与 Memory 有什么本质区别？自动压缩的触发条件、原子性保证是怎样的？",
        idea: `
          <p>先划清「Compact 换的是<b>发给模型的会话历史</b>，Memory 管的是<b>工作记忆与长期知识</b>」这条界线，再讲触发（token 比例优先、字符回退）和原子性（只在校验通过后一次性 replace）。</p>`,
        exp: `
          <p>Context Compact 把过长会话历史压成一条可继续执行的摘要，解决模型上下文预算问题，<b>不</b>删除 Task/Checkpoint/Working Memory/Agent Profile/Atomic Flow/磁盘日志。</p>
          <h4>触发（自动）</h4>
          <p>只在<b>一个 Stage 已结束且策略决定继续</b>时调用 <code>maybeCompact()</code>——不会在模型/工具执行中插入。判断优先级：</p>
          <ol>
            <li>有 <code>contextWindow</code> 且有 <code>peakInputTokens</code> → 用 Token 比例；</li>
            <li>缺任一 Token 指标 → 用 History 字符数与 <code>32768</code> 字符回退上限；</li>
            <li>达到 <code>compactAtContextRatio</code>（默认 0.7）才压；摘要预算由 <code>compactToContextRatio</code>（默认 0.25）算；</li>
            <li>Token 路径按每 Token 4 字符换算 <code>maxSummaryChars</code>；</li>
            <li>成功后清空 <code>peakInputTokens</code>，下一 Stage 重新计量。</li>
          </ol>
          <p>约束：<code>compactToContextRatio &lt; compactAtContextRatio</code>，且都严格位于 0 和 1 之间。</p>`,
        ans: `
          <p><b>本质区别</b>：</p>
          <ul>
            <li><b>Context Compact</b> = 替换「本次发送给模型的 Conversation History」，是<b>瘦身</b>动作，产物是一条 assistant 摘要。</li>
            <li><b>Memory</b> = 管理跨 Turn/Session 的工作记忆与长期知识，是<b>沉淀</b>动作，写入 SQLite。</li>

          </ul>
          <p><b>原子性保证</b>（很关键）：</p>
          <ul>
            <li><code>PreCompact</code> Hook <code>block/stop</code> → 在调用 Summarizer 前终止，History <b>不变</b>；</li>
            <li>Summarizer 抛错 / 返回空串 / 超出字符上限 → History <b>不变</b>；</li>
            <li>History 只在摘要完成<b>并通过校验后一次性</b> <code>replace()</code>；</li>
            <li><code>PostCompact</code> 在替换后运行，其失败不回滚已生成摘要；</li>
            <li>未配置 Summarizer → 手动/自动压缩都<b>显式失败</b>。</li>
          </ul>
          <p><b>信任边界</b>：压缩后的摘要是模型生成内容，后续 Prompt 里仍按 <code>untrusted</code> Conversation History 包装——压缩<b>不会</b>提权、扩 Capability，也不会把 Hook/Workspace 内容变成 System Instructions。</p>
          <p><b>观测</b>：成功发 <code>context_compacted</code>（只记条目数，不含摘要正文），投影为 <code>context.compact</code> Atom；CLI 收到后重置 Context 使用量。</p>`,
        follow: `
          <ul>

            <li>为什么原始 Transcript/JSONL/Atomic Flow 不被重写？（答：Compact 只减少送模型的历史，审计与事实源必须保真。）</li>

      {

        cat: "Subagents / A2A",
        diff: 3,
        tags: ["handoff", "delegate", "session-subagent", "隔离"],
        q: "Handoff、Configured Delegate、Session Subagent 三种协作机制在生命周期、控制权和持久化上有何不同？分别适合什么场景？",
        idea: `
          <p>用一张三列对比表打底：<b>生命周期 / 控制权 / 持久化 / 适用场景</b>。再补 Delegate 的三种访问模式（只读、共享读写、Worktree）和它们的隔离手段。</p>`,
        exp: `
          <p>三者共享 Agent Factory 和运行观测，但语义不同：</p>
          <table style="width:100%;border-collapse:collapse;font-size:0.82rem">
            <tr style="color:var(--cyan)"><td style="padding:4px 6px;border-bottom:1px solid var(--line)">机制</td><td style="border-bottom:1px solid var(--line)">生命周期</td><td style="border-bottom:1px solid var(--line)">控制权</td><td style="border-bottom:1px solid var(--line)">场景</td></tr>

            <tr><td style="padding:4px 6px"><b>Delegate</b></td><td>当前 Tool Call</td><td>父等待结果后继续</td><td>有界并行子任务</td></tr>
            <tr><td style="padding:4px 6px"><b>Session Subagent</b></td><td>Profile 持久 / Instance 每次运行</td><td>由管理服务显式启动</td><td>可复用专家角色</td></tr>
          </table>
          <h4>Delegate 三种访问模式</h4>

            <li><b>只读</b>：可读不可写，适合审查/搜索，受 <code>maxParallelReaders</code> 限制。</li>

        ans: `
          <p><b>三句话区分</b>：Handoff 是「交棒」——控制权在同一 SDK Run 内转移、不创建子 Session；Delegate 是「外包一个有界子任务」——父 Agent 通过工具调用发起、等结果回来再继续；Session Subagent 是「雇一个可复用专家」——有持久 Profile、可多次实例化。</p>
          <p><b>关键差异细节</b>：</p>
          <ul>
            <li>Handoff 目标必须在当前 Agent 的 <code>handoffs</code> 里，Graph 构建<b>拒绝环</b>；因为控制权已转移，它<b>不</b>返回可供父 Agent 继续推理的结果。</li>
            <li>Delegate 的 <code>SubagentStop</code> Hook <code>block</code> 不是终态失败，而是把 reasons 作为反馈<b>再次调用</b>子 Agent。</li>
            <li>Session Subagent 走 <code>AgentManagementService</code> 管理 Profile/Instance，<b>不</b>经过 SubagentRuntime 的 Start/Stop 重试循环；CLI 创建的 Session Subagent 显式关闭独立工业 Eval（避免把子运行误当顶层门禁），但领域 Validator 仍生效。</li>
          </ul>
          <p><b>安全不变量</b>：子 Agent 不继承未声明 Skill；Workspace Scope 只能<b>缩小</b>父范围；只读子 Agent 写入仍需权限升级；Hook <code>allow</code> 不能覆盖 Runtime <code>deny</code>。父 Agent <b>不</b>自动获得子 Agent 的完整 Transcript/Memory/内部推理——要复用的信息必须进最终输出或结构化 Artifact。</p>
          <p><b>选型建议</b>：代码审查/仓库理解默认只读 Delegate；隔离生成物或高风险修改用 Worktree；可复用职责（如固定 reviewer）用 Session Subagent；纯路由用 Handoff。</p>`,
        follow: `
          <ul>
            <li>A2A 消息里 <code>profileId</code>、<code>agentId</code>、<code>agentSessionId</code>、<code>sessionId</code> 能互换吗？（答：不能。profileId 是可复用定义、agentId 是运行实例、agentSessionId 是子逻辑 Session、sessionId 是顶层父 Session。）</li>

      },
      {

        q: "Yiku 的工业 Eval 链路如何决定一次任务是「接受 / 降级 / 重试 / 待复核 / 拒绝」？请讲讲评分规则和 Completion Policy 的决策顺序。",
        idea: `
          <p>先讲链路（Planner → Scheduler → Scorecard → CompletionPolicy），再重点讲 <b>评分不能被平均分抵消 Blocker</b> 和 <b>决策顺序是有优先级的 if-else 链</b>。强调「缺失结果不能提高分数」。</p>`,
        exp: `
          <p><code>@yiku/evals</code> 对<b>已完成</b>的 Run 做可解释、可持久化的质量评估，它消费最终输出/Artifact/Receipt/Manifest/Atomic Snapshot，<b>不</b>执行 Agent、<b>不</b>独立决定 Session 终态。</p>
          <h4>链路</h4>
          <p><code>EvalPlanner</code>（Profile+Registry → 不可变 Plan + Digest）→ <code>EvalScheduler</code>（按依赖 DAG 跑 Check，默认单 Run 4 并发、全局 8 Run、单 Run≤32 Check）→ <code>Scorecard</code> → <code>CompletionPolicy</code>。</p>
          <h4>评分规则</h4>
          <ul>

            <li>Digest 不含运行时耗时等非确定性噪声 → 相同 Plan+Input+结果产生相同 Scorecard Digest；</li>
            <li>Grade：<code>S≥0.95 / A≥0.90 / B≥0.80 / C≥0.70</code>，其余 D。</li>
            <li><code>qualityPassed</code> 同时要求：无 Blocker 非通过、无 partial/unknown Receipt、所有 Required Check 通过、总分达阈值。</li>

        ans: `
          <p><b>Completion Policy 的决策顺序是一条有优先级的 if-else 链</b>：</p>
          <ol>
            <li><code>partial</code>/<code>unknown</code> Operation Receipt → <b>needs-review</b>；</li>
            <li>Blocker 失败 → 有可修复项且有预算则 <b>retry</b>，否则 <b>rejected</b>；</li>
            <li>Required Check 为 <code>error</code>/<code>not-run</code> → <b>needs-review</b>；</li>
            <li>Required Check 失败或总分不足 → <b>retry</b> 或 <b>rejected</b>；</li>

          <p><b>底线原则</b>：任何缺失结果都不能提高分数；Store 冲突/损坏/权限错误不伪装为通过；Observer/Studio 故障只影响观测不改 Scorecard。非交互退出码：needs-review=6，rejected=8。</p>`,

        idea: `
          <p>核心：<b>只有宿主显式提供的 Runtime/User Instructions 能进 System Instructions，其它一律 untrusted 带边界注入</b>。再区分 PromptGuard 是「风险信号」而非「阻断决策者」。</p>`,
        exp: `
          <p>Runtime 用 <code>PromptSegment</code> 保留上下文的来源、类型、信任级别、可选 Source ID 和 Digest。</p>
          <h4>会被当作 untrusted 的内容</h4>

            <li>Workspace Instructions、项目 <code>config.yaml</code>/<code>.env</code> Instructions；</li>

        ans: `
          <p><b>防御主线是「信任分级 + 边界包装」</b>：</p>

            <li><b>白名单进 System</b>：只有宿主显式提供的 Runtime/User Instructions 能进入 Agent System Instructions。</li>

            <li><b>每轮重新包装</b>：Runner 每次模型调用前重包 Tool Result，防止「一次注入、永久污染」。</li>

          <p><b>PromptGuard 的角色（关键区分）</b>：它拒绝空输入、异常控制字符、超预算 Prompt/Segment，并对指令覆盖、Prompt 窃取、角色替换、Tool 强迫等特征发出<b>不含原文</b>的 <code>prompt_risk_detected</code>。但它<b>只提供风险信号</b>——是否阻断由 Managed Hook 或宿主 Policy 决定。<b>Tool Permission 和 Workspace Boundary 始终独立执行</b>，不依赖 PromptGuard。</p>

        follow: `

        q: "Hooks 在 Yiku 里承担什么职责？为什么规定「Hook 的 allow 不能覆盖 Runtime 的 deny」？",
        idea: `
          <p>先定位 Hooks 是 Claude 兼容的生命周期策略层（六类 Executor），再讲它在权限链里的位置，最后从「安全单调性」角度解释 allow 不能覆盖 deny。</p>`,
        exp: `
          <p><code>@yiku/hooks</code> 拥有 Hook 事件、配置编译、匹配、六类 Executor、Decision、Trust 和安全限制，<b>不</b>依赖 Orchestrator/Agent SDK/CLI/Atomic Flow。它在生命周期边界运行：Session/Prompt Hook、Tool Hook（副作用前后包围）、PreCompact/PostCompact、SubagentStart/Stop、PermissionRequest/PermissionDenied 等。</p>
          <h4>关键顺序</h4>
          <ol>
            <li>Session/Prompt Hook 在对应生命周期边界运行；</li>
            <li>Memory Recall 在 Agent 上下文构建前完成；</li>
            <li>Tool Hook 在副作用前后包围 Tool 调用；</li>
            <li>领域 Validator 在输出后运行；</li>
            <li>工业 Evals 读取最终产物；</li>
            <li>Completion Policy 决定终态。</li>
          </ol>`,
        ans: `
          <p><b>职责</b>：Hooks 是可插拔的<b>生命周期策略层</b>，让用户/管理策略在 Session、Prompt、Tool、Compact、Subagent、Permission 等边界注入决策（allow/block/stop）或附加上下文，而不用改 Orchestrator 代码。它用独立 Trust Store 管理信任，不能用 Permission Profile 替代。</p>
          <p><b>为什么 allow 不能覆盖 deny</b>（安全单调性）：</p>
          <ul>
            <li>权限体系是<b>多层交集</b>，Runtime 的 <code>deny</code> 是<b>硬边界</b>，在调用 Profile/Hook/人工之前就生效；</li>
            <li>如果允许后置的 Hook <code>allow</code> 翻案，就等于给了「用配置/Skill 提交的 Hook」一条<b>提权后门</b>——而项目内容本就不该自行扩权；</li>
            <li>因此 Hook 的 <code>allow</code> 只能作用于「已经进入 Hook 的 <code>ask</code> 请求」，<b>只能收紧不能放宽</b>先前的硬拒绝。这保证无论加多少 Hook，安全边界只会更严不会更松。</li>
          </ul>
          <p><b>PreCompact 的 block/stop</b> 是这个原则的具体体现：它能在调用 Summarizer 前终止压缩（收紧），但不能强行改写权限或历史。</p>`,
        follow: `

          <p><b>flow-graph 解决的问题</b>：给定一批节点和连接，算出<b>好看且不重叠的正交连线</b>（端口分配、绕障、路径优化、SVG Path）。这是纯几何/图论问题。</p>
          <p><b>为什么 flow-graph 要零依赖 React/DOM/业务</b>：</p>
          <ul>

            <li><b>边界纪律</b>：「Flow Graph 只处理几何与路由，不决定业务节点、颜色或运行状态」是明文不变量——防止把业务耦合渗进通用算法层。</li>

    </script>
    <script id="app-script">
      // ====================================================================
      // 应用层：状态、研习模式渲染、筛选、模拟面试引擎、评分与报告
      // 纯原生 JS，无外部依赖；进度存 localStorage（自包含）。
      // ====================================================================
      "use strict";
      const LS_KEY = "yiku-interview-progress-v1";
      const $ = (sel, root = document) => root.querySelector(sel);
      const el = (tag, props = {}, children = []) => {
        const node = document.createElement(tag);
        for (const [k, v] of Object.entries(props)) {
          if (k === "class") node.className = v;
          else if (k === "html") node.innerHTML = v;
          else if (k === "text") node.textContent = v;
          else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2), v);
          else if (v !== null && v !== undefined) node.setAttribute(k, v);
        }
        (Array.isArray(children) ? children : [children]).forEach((c) => {
          if (c === null || c === undefined) return;
          node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
        });
        return node;
      };

      const state = {
        mode: "study",
        activeId: QUESTIONS[0].id,
        catFilter: new Set(),
        diffFilter: new Set(),
        search: "",
        done: new Set(),        // 研习标记「已掌握」
        mock: null,             // 模拟面试运行时
      };

      // ---- 持久化 ----
      function loadProgress() {
        try {
          const raw = localStorage.getItem(LS_KEY);
          if (raw) {
            const data = JSON.parse(raw);
            (data.done || []).forEach((id) => {
              state.done.add(id);
            });
          }
        } catch (_) {}
      }
      function saveProgress() {
        try {
          localStorage.setItem(LS_KEY, JSON.stringify({ done: [...state.done] }));
        } catch (_) {}
      }

      // ---- 过滤 ----
      function filteredQuestions() {
        const q = state.search.trim().toLowerCase();
        return QUESTIONS.filter((item) => {
          if (state.catFilter.size && !state.catFilter.has(item.cat)) return false;
          if (state.diffFilter.size && !state.diffFilter.has(item.diff)) return false;
          if (q) {
            const hay = (`${item.q} ${item.cat} ${item.tags.join(" ")}`).toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        });
      }

      // ---- 顶部进度 ----
      function renderStat() {
        $("#progressStat").innerHTML = `已掌握 <b>${state.done.size}</b>/${QUESTIONS.length}`;
      }

      // ---- 侧边栏 ----
      function renderFilters() {
        const catBox = $("#catFilter");
        const diffBox = $("#diffFilter");
        catBox.innerHTML = "";
        diffBox.innerHTML = "";
        CATS.forEach((c) => {
          const active = state.catFilter.has(c);
          catBox.appendChild(
            el("button", {
              class: `chip${active ? " active" : ""}`,
              text: c,
              onclick: () => { active ? state.catFilter.delete(c) : state.catFilter.add(c); renderSidebar(); },
            })
          );
        });
        [1, 2, 3].forEach((d) => {
          const active = state.diffFilter.has(d);
          diffBox.appendChild(
            el("button", {
              class: `chip${active ? " active" : ""}`,
              text: DIFF_LABEL[d],
              onclick: () => { active ? state.diffFilter.delete(d) : state.diffFilter.add(d); renderSidebar(); },
            })
          );
        });
      }

      function renderSidebar() {
        renderFilters();
        const list = $("#qList");
        list.innerHTML = "";
        const items = filteredQuestions();
        if (!items.length) {
          list.appendChild(el("li", { class: "empty", text: "无匹配题目" }));
          return;
        }
        items.forEach((item, i) => {
          const li = el("li", {
            class: (item.id === state.activeId ? "active " : "") + (state.done.has(item.id) ? "done" : ""),
            onclick: () => { state.activeId = item.id; renderMain(); renderSidebar(); },
          });
          li.appendChild(el("span", { class: "q-idx", text: `Q${QUESTIONS.indexOf(item) + 1}` }));
          li.appendChild(el("span", { class: "q-title", text: item.q.length > 46 ? `${item.q.slice(0, 46)}…` : item.q }));
          const meta = el("div", { class: "q-meta" });
          meta.appendChild(el("span", { class: "tag cat", text: item.cat }));
          meta.appendChild(el("span", { class: `tag d${item.diff}`, text: DIFF_LABEL[item.diff] }));
          if (state.done.has(item.id)) meta.appendChild(el("span", { class: "done-dot", text: "✓" }));
          li.appendChild(meta);
          list.appendChild(li);
        });
        renderStat();
      }

      // ---- 研习主区 ----
      const SECTIONS = [
        { key: "idea", name: "解题思路", mark: "IDEA", cls: "mark-idea", open: true },
        { key: "exp", name: "背景解释", mark: "EXP", cls: "mark-exp", open: false },
        { key: "ans", name: "参考答案", mark: "ANS", cls: "mark-ans", open: false },
        { key: "follow", name: "延伸追问", mark: "FLW", cls: "mark-follow", open: false },
      ];

      function renderMain() {
        const main = $("#main");
        main.innerHTML = "";
        if (state.mode === "mock") { renderMock(main); return; }

        const item = QUESTIONS.find((q) => q.id === state.activeId) || QUESTIONS[0];
        const idx = QUESTIONS.indexOf(item);

        const head = el("div", { class: "q-head" });
        head.appendChild(el("div", { class: "kicker", text: `Question ${idx + 1} / ${QUESTIONS.length}` }));
        head.appendChild(el("h1", { text: item.q }));
        const meta = el("div", { class: "meta" });
        meta.appendChild(el("span", { class: "tag cat", text: item.cat }));
        meta.appendChild(el("span", { class: `tag d${item.diff}`, text: `难度 · ${DIFF_LABEL[item.diff]}` }));
        item.tags.forEach((t) => {
          meta.appendChild(el("span", { class: "tag", html: `<span style="color:var(--faint)">#${t}</span>` }));
        });
        head.appendChild(meta);
        main.appendChild(head);

        // 工具行
        const tools = el("div", { class: "tool-row" });
        tools.appendChild(el("button", { class: "ghost-btn", text: "全部展开", onclick: () => toggleAll(true) }));
        tools.appendChild(el("button", { class: "ghost-btn", text: "全部收起", onclick: () => toggleAll(false) }));
        const doneBtn = el("button", {
          class: "ghost-btn",
          text: state.done.has(item.id) ? "✓ 已标记掌握" : "标记为已掌握",
          onclick: () => {
            state.done.has(item.id) ? state.done.delete(item.id) : state.done.add(item.id);
            saveProgress(); renderMain(); renderSidebar();
          },
        });
        if (state.done.has(item.id)) doneBtn.style.color = "var(--green)";
        tools.appendChild(doneBtn);
        main.appendChild(tools);
        main.appendChild(el("div", { style: "height:16px" }));

        SECTIONS.forEach((sec) => {
          if (!item[sec.key]) return;
          const section = el("div", { class: `section${sec.open ? " open" : ""}` });
          const headBtn = el("button", { class: "sec-head", type: "button", onclick: () => section.classList.toggle("open") });
          headBtn.appendChild(el("span", { class: `sec-mark ${sec.cls}`, text: sec.mark }));
          headBtn.appendChild(el("span", { class: "sec-name", text: sec.name }));
          headBtn.appendChild(el("span", { class: "caret", text: "▶" }));
          section.appendChild(headBtn);
          section.appendChild(el("div", { class: "sec-body", html: item[sec.key] }));
          main.appendChild(section);
        });

        // 导航
        const nav = el("div", { class: "nav-row" });
        const prev = el("button", { class: "nav-btn", text: "← 上一题", disabled: idx === 0 ? "true" : null,
          onclick: () => { if (idx > 0) { state.activeId = QUESTIONS[idx - 1].id; renderMain(); renderSidebar(); scrollTop(); } } });
        const next = el("button", { class: "nav-btn primary", text: "下一题 →", disabled: idx === QUESTIONS.length - 1 ? "true" : null,
          onclick: () => { if (idx < QUESTIONS.length - 1) { state.activeId = QUESTIONS[idx + 1].id; renderMain(); renderSidebar(); scrollTop(); } } });
        nav.appendChild(prev);
        nav.appendChild(next);
        main.appendChild(nav);
      }

      function toggleAll(open) {
        document.querySelectorAll(".main .section").forEach((s) => {
          s.classList.toggle("open", open);
        });
      }
      function scrollTop() { window.scrollTo({ top: 0, behavior: "smooth" }); }

      // ================= 模拟面试引擎 =================
      function renderMock(main) {
        if (!state.mock) { renderMockSetup(main); return; }
        if (state.mock.finished) { renderMockReport(main); return; }
        renderMockQuestion(main);
      }

      function renderMockSetup(main) {
        const wrap = el("div", { class: "mock-wrap" });
        const setup = el("div", { class: "mock-setup" });
        setup.appendChild(el("h2", { text: "模拟面试 · 配置" }));
        setup.appendChild(el("p", { class: "sub", text: "选择范围与题量，进入限时作答。每题先自述作答，再对照参考答案自评评分，最后生成成绩单。" }));

        // 分类范围
        const catField = el("div", { class: "field" });
        catField.appendChild(el("label", { text: "题目范围（不选=全部）" }));
        const catRow = el("div", { class: "opt-row" });
        const chosenCats = state.mockCfg?.cats || new Set();
        CATS.forEach((c) => {
          const active = chosenCats.has(c);
          catRow.appendChild(el("button", {
            class: `chip${active ? " active" : ""}`, text: c,
            onclick: () => {
              state.mockCfg = state.mockCfg || { cats: new Set(), diffs: new Set(), count: 6 };
              active ? state.mockCfg.cats.delete(c) : state.mockCfg.cats.add(c);
              renderMain();
            },
          }));
        });
        catField.appendChild(catRow);
        setup.appendChild(catField);

        // 难度范围
        const diffField = el("div", { class: "field" });
        diffField.appendChild(el("label", { text: "难度范围（不选=全部）" }));
        const diffRow = el("div", { class: "opt-row" });
        const chosenDiffs = state.mockCfg?.diffs || new Set();
        [1, 2, 3].forEach((d) => {
          const active = chosenDiffs.has(d);
          diffRow.appendChild(el("button", {
            class: `chip${active ? " active" : ""}`, text: DIFF_LABEL[d],
            onclick: () => {
              state.mockCfg = state.mockCfg || { cats: new Set(), diffs: new Set(), count: 6 };
              active ? state.mockCfg.diffs.delete(d) : state.mockCfg.diffs.add(d);
              renderMain();
            },
          }));
        });
        diffField.appendChild(diffRow);
        setup.appendChild(diffField);

        // 可选池大小提示
        const pool = mockPool();
        // 题量
        const cntField = el("div", { class: "field" });
        cntField.appendChild(el("label", { text: "题量" }));
        const cfg = state.mockCfg || { cats: new Set(), diffs: new Set(), count: 6 };
        const maxN = Math.max(1, pool.length);
        const curN = Math.min(cfg.count || 6, maxN);
        const rangeRow = el("div", { class: "range-row" });
        const range = el("input", { type: "range", min: "1", max: String(maxN), value: String(curN) });
        const val = el("span", { class: "val", text: String(curN) });
        range.addEventListener("input", () => {
          val.textContent = range.value;
          state.mockCfg = state.mockCfg || cfg;
          state.mockCfg.count = Number(range.value);
        });
        rangeRow.appendChild(range);
        rangeRow.appendChild(val);
        cntField.appendChild(rangeRow);
        cntField.appendChild(el("p", { class: "sub", style: "margin:8px 0 0", text: `当前范围可用题目：${pool.length} 道` }));
        setup.appendChild(cntField);

        // 每题时限
        const timeField = el("div", { class: "field" });
        timeField.appendChild(el("label", { text: "每题时限" }));
        const timeRow = el("div", { class: "opt-row" });
        [
          { label: "不限时", v: 0 },
          { label: "3 分钟", v: 180 },
          { label: "5 分钟", v: 300 },
          { label: "8 分钟", v: 480 },
        ].forEach((opt) => {
          const active = (state.mockCfg?.perQ ?? 300) === opt.v;
          timeRow.appendChild(el("button", {
            class: `chip${active ? " active" : ""}`, text: opt.label,
            onclick: () => { state.mockCfg = state.mockCfg || cfg; state.mockCfg.perQ = opt.v; renderMain(); },
          }));
        });
        timeField.appendChild(timeRow);
        setup.appendChild(timeField);

        const startBtn = el("button", { class: "start-btn", text: "▶ 开始模拟面试", disabled: pool.length ? null : "true",
          onclick: startMock });
        setup.appendChild(startBtn);
        wrap.appendChild(setup);
        main.appendChild(wrap);
      }

      function mockPool() {
        const cfg = state.mockCfg || { cats: new Set(), diffs: new Set() };
        return QUESTIONS.filter((q) => {
          if (cfg.cats?.size && !cfg.cats.has(q.cat)) return false;
          if (cfg.diffs?.size && !cfg.diffs.has(q.diff)) return false;
          return true;
        });
      }

      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function startMock() {
        const cfg = state.mockCfg || { count: 6, perQ: 300 };
        const pool = shuffle(mockPool());
        const count = Math.min(cfg.count || 6, pool.length);
        const items = pool.slice(0, count);
        state.mock = {
          items,
          answers: items.map(() => ({ text: "", grade: null, revealed: false })),
          cur: 0,
          perQ: cfg.perQ ?? 300,
          finished: false,
          startedAt: Date.now(),
        };
        renderMain();
        scrollTop();
      }

      function renderMockQuestion(main) {
        const m = state.mock;
        const item = m.items[m.cur];
        const ans = m.answers[m.cur];
        const wrap = el("div", { class: "mock-wrap" });

        // 进度条
        const prog = el("div", { class: "mock-progress" });
        prog.appendChild(el("span", { class: "count", text: `第 ${m.cur + 1} / ${m.items.length} 题` }));
        const bar = el("div", { class: "bar" });
        bar.appendChild(el("i", { style: `width:${((m.cur) / m.items.length) * 100}%` }));
        prog.appendChild(bar);
        const timer = el("span", { class: "timer", id: "mockTimer", text: m.perQ ? fmtTime(m.perQ) : "∞" });
        prog.appendChild(timer);
        wrap.appendChild(prog);

        // 题面
        const card = el("div", { class: "mock-card" });
        card.appendChild(el("div", { class: "kicker", text: `${item.cat} · 难度 ${DIFF_LABEL[item.diff]}` }));
        card.appendChild(el("h2", { text: item.q }));

        const ta = el("textarea", { placeholder: "在此写下你的作答要点（口述面试时可只记提纲）…" });
        ta.value = ans.text;
        ta.addEventListener("input", () => { ans.text = ta.value; });
        card.appendChild(ta);

        // 提示（思路）—可选查看
        const hintBtn = el("button", { class: "ghost-btn", style: "margin-top:12px", text: ans.hintOpen ? "隐藏思路提示" : "💡 看一眼思路提示（不影响作答）",
          onclick: () => { ans.hintOpen = !ans.hintOpen; renderMain(); } });
        card.appendChild(hintBtn);
        if (ans.hintOpen) card.appendChild(el("div", { class: "hint-box", html: item.idea }));

        // 揭示答案 + 自评
        if (!ans.revealed) {
          card.appendChild(el("div", { style: "margin-top:18px" }, [
            el("button", { class: "nav-btn primary", text: "提交并查看参考答案", onclick: () => { ans.revealed = true; stopTimer(); renderMain(); } }),
          ]));
        } else {
          const reveal = el("div", { class: "reveal-block" });
          [
            { name: "参考答案", mark: "ANS", cls: "mark-ans", key: "ans", open: true },
            { name: "背景解释", mark: "EXP", cls: "mark-exp", key: "exp", open: false },
            { name: "解题思路", mark: "IDEA", cls: "mark-idea", key: "idea", open: false },
            { name: "延伸追问", mark: "FLW", cls: "mark-follow", key: "follow", open: false },
          ].forEach((sec) => {
            if (!item[sec.key]) return;
            const section = el("div", { class: `section${sec.open ? " open" : ""}` });
            const hb = el("button", { class: "sec-head", type: "button", onclick: () => section.classList.toggle("open") });
            hb.appendChild(el("span", { class: `sec-mark ${sec.cls}`, text: sec.mark }));
            hb.appendChild(el("span", { class: "sec-name", text: sec.name }));
            hb.appendChild(el("span", { class: "caret", text: "▶" }));
            section.appendChild(hb);
            section.appendChild(el("div", { class: "sec-body", html: item[sec.key] }));
            reveal.appendChild(section);
          });
          card.appendChild(reveal);

          // 自评
          const grade = el("div", { class: "self-grade" });
          grade.appendChild(el("label", { style: "display:block;font-family:var(--mono);font-size:0.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:8px", text: "对照参考答案，为本题自评：" }));
          const opts = el("div", { class: "grade-opts" });
          const gdefs = [
            { g: 0, cls: "g0", label: "未答对", sub: "0 分 · 关键点缺失" },
            { g: 1, cls: "g1", label: "部分正确", sub: "0.6 分 · 命中部分" },
            { g: 2, cls: "g2", label: "完整正确", sub: "1.0 分 · 覆盖要点" },
          ];
          gdefs.forEach((gd) => {
            const b = el("button", { class: `grade-btn ${gd.cls}${ans.grade === gd.g ? " active" : ""}`,
              onclick: () => { ans.grade = gd.g; gotoNextOrFinish(); } });
            if (ans.grade === gd.g) { b.style.borderColor = gd.g === 2 ? "var(--green)" : gd.g === 1 ? "var(--yellow)" : "var(--red)"; }
            b.appendChild(el("div", { text: gd.label }));
            b.appendChild(el("small", { text: gd.sub }));
            opts.appendChild(b);
          });
          grade.appendChild(opts);
          card.appendChild(grade);
        }
        wrap.appendChild(card);

        // 底部导航
        const nav = el("div", { class: "nav-row" });
        nav.appendChild(el("button", { class: "nav-btn", text: "‹ 上一题", disabled: m.cur === 0 ? "true" : null,
          onclick: () => { if (m.cur > 0) { m.cur--; renderMain(); scrollTop(); } } }));
        const rightWrap = el("div", { style: "display:flex;gap:8px" });
        rightWrap.appendChild(el("button", { class: "nav-btn", text: "退出模拟", onclick: () => { stopTimer(); if (confirm("退出并放弃本次模拟？")) { state.mock = null; renderMain(); } } }));
        if (m.cur < m.items.length - 1) {
          rightWrap.appendChild(el("button", { class: "nav-btn", text: "跳过 / 下一题 ›", onclick: () => { m.cur++; renderMain(); scrollTop(); } }));
        } else {
          rightWrap.appendChild(el("button", { class: "nav-btn primary", text: "结束并出成绩单", onclick: finishMock }));
        }
        nav.appendChild(rightWrap);
        wrap.appendChild(nav);
        main.appendChild(wrap);

        // 计时器
        if (m.perQ && !ans.revealed) startTimer(m.perQ, ans);
        else stopTimer();
      }

      function gotoNextOrFinish() {
        const m = state.mock;
        if (m.cur < m.items.length - 1) { m.cur++; renderMain(); scrollTop(); }
        else { finishMock(); }
      }

      // 计时器
      let timerHandle = null;
      function startTimer(seconds, ans) {
        stopTimer();
        let remain = ans._remain != null ? ans._remain : seconds;
        ans._remain = remain;
        const node = $("#mockTimer");
        const paint = () => {
          if (!node) return;
          node.textContent = fmtTime(remain);
          node.className = `timer${remain <= 30 ? " danger" : remain <= 60 ? " warn" : ""}`;
        };
        paint();
        timerHandle = setInterval(() => {
          remain--; ans._remain = remain; paint();
          if (remain <= 0) { stopTimer(); ans.revealed = true; renderMain(); }
        }, 1000);
      }
      function stopTimer() { if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } }
      function fmtTime(s) { const m = Math.floor(s / 60); const ss = s % 60; return `${m}:${String(ss).padStart(2, "0")}`; }

      function finishMock() {
        stopTimer();
        state.mock.finished = true;
        state.mock.endedAt = Date.now();
        renderMain();
        scrollTop();
      }

      // ---- 成绩单 ----
      function renderMockReport(main) {
        const m = state.mock;
        const scores = m.answers.map((a) => (a.grade === 2 ? 1 : a.grade === 1 ? 0.6 : 0));
        const total = scores.reduce((s, x) => s + x, 0);
        const pct = m.items.length ? total / m.items.length : 0;
        const grade = pct >= 0.95 ? "S" : pct >= 0.9 ? "A" : pct >= 0.8 ? "B" : pct >= 0.7 ? "C" : "D";
        const gradeColor = { S: "var(--green)", A: "var(--green)", B: "var(--cyan)", C: "var(--yellow)", D: "var(--red)" }[grade];
        const answered = m.answers.filter((a) => a.grade !== null).length;
        const fulls = m.answers.filter((a) => a.grade === 2).length;
        const partials = m.answers.filter((a) => a.grade === 1).length;
        const misses = m.answers.filter((a) => a.grade === 0).length;
        const spent = Math.round(((m.endedAt || Date.now()) - m.startedAt) / 1000);

        const wrap = el("div", { class: "mock-wrap" });
        const rep = el("div", { class: "report" });
        rep.appendChild(el("h2", { text: "模拟面试 · 成绩单" }));

        // 分数环
        const hero = el("div", { class: "score-hero" });
        const R = 54, C = 2 * Math.PI * R;
        const dash = C * pct;
        const ring = el("div", { class: "score-ring", html: `
          <svg viewBox="0 0 130 130" width="130" height="130">
            <circle cx="65" cy="65" r="${R}" fill="none" stroke="var(--surface-3)" stroke-width="12"/>
            <circle cx="65" cy="65" r="${R}" fill="none" stroke="${gradeColor}" stroke-width="12"
              stroke-linecap="round" stroke-dasharray="${dash} ${C}" transform="rotate(-90 65 65)"/>
            <text x="65" y="60" text-anchor="middle" fill="${gradeColor}" font-size="30" font-family="var(--display)" font-weight="800">${grade}</text>
            <text x="65" y="82" text-anchor="middle" fill="var(--muted)" font-size="13" font-family="var(--mono)">${Math.round(pct * 100)}%</text>
          </svg>` });
        hero.appendChild(ring);
        const legend = el("div", { class: "score-legend" });
        legend.appendChild(el("div", { class: "grade-big", style: `color:${gradeColor}`, text: `等级 ${grade}` }));
        legend.appendChild(el("div", { class: "pct", text: `自评得分 ${total.toFixed(1)} / ${m.items.length}（${Math.round(pct * 100)}%）` }));
        legend.appendChild(el("div", { class: "pct", style: "margin-top:6px", text: `用时 ${fmtTime(spent)} · 已评 ${answered}/${m.items.length} 题` }));
        hero.appendChild(legend);
        rep.appendChild(hero);

        // 分项
        const bd = el("div", { class: "breakdown" });
        [
          { k: "完整正确", v: fulls, c: "var(--green)" },
          { k: "部分正确", v: partials, c: "var(--yellow)" },
          { k: "未答对", v: misses, c: "var(--red)" },
          { k: "题目总数", v: m.items.length, c: "var(--cyan)" },
        ].forEach((cell) => {
          const c = el("div", { class: "cell" });
          c.appendChild(el("div", { class: "k", text: cell.k }));
          c.appendChild(el("div", { class: "v", style: `color:${cell.c}`, text: String(cell.v) }));
          bd.appendChild(c);
        });
        rep.appendChild(bd);

        // 逐题回顾
        rep.appendChild(el("h4", { style: "color:var(--cyan);margin:8px 0 4px", text: "逐题回顾" }));
        m.items.forEach((item, i) => {
          const a = m.answers[i];
          const gl = a.grade === 2 ? { t: "完整", c: "var(--green)", bg: "rgba(114,210,155,0.12)" }
            : a.grade === 1 ? { t: "部分", c: "var(--yellow)", bg: "rgba(242,193,78,0.12)" }
            : a.grade === 0 ? { t: "未答对", c: "var(--red)", bg: "rgba(255,79,64,0.12)" }
            : { t: "未评分", c: "var(--faint)", bg: "var(--surface-3)" };
          const ri = el("div", { class: "review-item" });
          const rh = el("div", { class: "ri-head" });
          rh.appendChild(el("span", { class: `tag d${item.diff}`, text: DIFF_LABEL[item.diff] }));
          rh.appendChild(el("span", { class: "ri-title", text: `Q${i + 1}. ${item.q}` }));
          rh.appendChild(el("span", { class: "ri-badge", style: `color:${gl.c};background:${gl.bg}`, text: gl.t }));
          ri.appendChild(rh);
          // 展开看参考答案
          const det = el("div", { class: "section", style: "margin-top:10px" });
          const hb = el("button", { class: "sec-head", type: "button", onclick: () => det.classList.toggle("open") });
          hb.appendChild(el("span", { class: "sec-mark mark-ans", text: "ANS" }));
          hb.appendChild(el("span", { class: "sec-name", text: "查看参考答案与你的作答" }));
          hb.appendChild(el("span", { class: "caret", text: "▶" }));
          det.appendChild(hb);
          const body = el("div", { class: "sec-body" });
          body.appendChild(el("h4", { text: "你的作答" }));
          body.appendChild(el("div", { style: "white-space:pre-wrap;font-family:var(--mono);font-size:0.82rem;color:var(--muted);border-left:3px solid var(--line);padding-left:12px;margin-bottom:14px", text: a.text.trim() || "（未作答）" }));
          body.appendChild(el("h4", { text: "参考答案" }));
          body.appendChild(el("div", { html: item.ans }));
          det.appendChild(body);
          ri.appendChild(det);
          rep.appendChild(ri);
        });

        // 操作
        const nav = el("div", { class: "nav-row" });
        nav.appendChild(el("button", { class: "nav-btn", text: "↺ 再来一次（相同配置）", onclick: startMock }));
        nav.appendChild(el("button", { class: "nav-btn primary", text: "重新配置模拟", onclick: () => { state.mock = null; renderMain(); scrollTop(); } }));
        rep.appendChild(nav);

        wrap.appendChild(rep);
        main.appendChild(wrap);
      }

      // ---- 模式切换 ----
      function setMode(mode) {
        state.mode = mode;
        document.querySelectorAll("#modeSwitch button").forEach((b) => {
          b.classList.toggle("active", b.dataset.mode === mode);
        });
        $("#sidebar").style.display = mode === "study" ? "" : "none";
        stopTimer();
        renderMain();
        scrollTop();
      }

      // ---- 初始化 ----
      function init() {
        loadProgress();
        document.querySelectorAll("#modeSwitch button").forEach((b) => {
          b.addEventListener("click", () => setMode(b.dataset.mode));
        });
        $("#searchBox").addEventListener("input", (e) => { state.search = e.target.value; renderSidebar(); });
        // 键盘导航（研习模式）
        document.addEventListener("keydown", (e) => {
          if (state.mode !== "study") return;
          if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
          const idx = QUESTIONS.findIndex((q) => q.id === state.activeId);
          if (e.key === "ArrowRight" && idx < QUESTIONS.length - 1) { state.activeId = QUESTIONS[idx + 1].id; renderMain(); renderSidebar(); }
          if (e.key === "ArrowLeft" && idx > 0) { state.activeId = QUESTIONS[idx - 1].id; renderMain(); renderSidebar(); }
        });
        renderSidebar();
        renderMain();
        renderStat();
      }
      init();
    </script>
  </body>
</html>
